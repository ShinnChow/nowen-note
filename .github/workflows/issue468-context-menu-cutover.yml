name: Issue 468 Context Menu Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_issue468_context_menu.py'
      - '.github/workflows/issue468-context-menu-cutover.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply context-menu integration patch
        run: python3 scripts/patch_issue468_context_menu.py
      - name: Remove one-time patch script
        run: rm scripts/patch_issue468_context_menu.py
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(knowledge-tree): restore directory context-menu capabilities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
