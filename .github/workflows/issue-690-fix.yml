name: Apply Issue 690 Fix

on:
  push:
    branches:
      - release/v1.4.6
    paths:
      - ".github/workflows/issue-690-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source and regression-test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path("backend/src/routes/attachments-core.ts")
          core = core_path.read_text(encoding="utf-8")

          signature = 'export async function handleDownloadAttachment(c: Context): Promise<Response> {'
          replacement = (
              'export async function handleDownloadAttachment(\n'
              '  c: Context,\n'
              '  dependencies: {\n'
              '    readAttachmentObject?: typeof readAttachmentObject;\n'
              '    getOrCreateThumbnailFromBufferAsync?: typeof getOrCreateThumbnailFromBufferAsync;\n'
              '  } = {},\n'
              '): Promise<Response> {'
          )
          assert core.count(signature) == 1, "unexpected download handler signature count"
          core = core.replace(signature, replacement, 1)

          width_line = '  const requestedWidth = parseThumbnailWidth(c.req.query("w"));\n'
          width_replacement = (
              width_line
              + '  const readObject = dependencies.readAttachmentObject ?? readAttachmentObject;\n'
              + '  const createThumbnailFromBuffer = dependencies.getOrCreateThumbnailFromBufferAsync\n'
              + '    ?? getOrCreateThumbnailFromBufferAsync;\n'
          )
          assert core.count(width_line) == 1, "requestedWidth insertion point missing"
          core = core.replace(width_line, width_replacement, 1)

          thumbnail_start = '  if (willServeThumbnail) {\n'
          assert core.count(thumbnail_start) == 1, "thumbnail branch insertion point missing"
          core = core.replace(
              thumbnail_start,
              '  let sourceBuffer: Buffer | null | undefined;\n' + thumbnail_start,
              1,
          )

          remote_call = (
              '      : await getOrCreateThumbnailFromBufferAsync(\n'
              '          ATTACHMENTS_DIR,\n'
              '          row.id,\n'
              '          (await readAttachmentObject(row.path)) || Buffer.alloc(0),\n'
              '          row.mimeType,\n'
              '          requestedWidth!,\n'
              '        );'
          )
          remote_replacement = (
              '      : await (async () => {\n'
              '          sourceBuffer = await readObject(row.path);\n'
              '          if (!sourceBuffer) return null;\n'
              '          return createThumbnailFromBuffer(\n'
              '            ATTACHMENTS_DIR,\n'
              '            row.id,\n'
              '            sourceBuffer,\n'
              '            row.mimeType,\n'
              '            requestedWidth!,\n'
              '          );\n'
              '        })();'
          )
          assert core.count(remote_call) == 1, "remote thumbnail call changed unexpectedly"
          core = core.replace(remote_call, remote_replacement, 1)

          original_read = '  const buffer = await readAttachmentObject(row.path);\n'
          original_replacement = (
              '  // undefined = 尚未读取；null = 已读取但对象不存在；Buffer = 可直接复用。\n'
              '  // 远程缩略图生成失败时必须复用同一次请求已取得的原图，避免 NAS/S3\n'
              '  // 再次下载；对象缺失时也不能为了确认 404 再读一次。\n'
              '  const buffer = sourceBuffer === undefined\n'
              '    ? await readObject(row.path)\n'
              '    : sourceBuffer;\n'
          )
          assert core.count(original_read) == 1, "original object read changed unexpectedly"
          core = core.replace(original_read, original_replacement, 1)
          core_path.write_text(core, encoding="utf-8")

          test_path = Path("backend/tests/attachment-cache-contract.test.ts")
          test_source = test_path.read_text(encoding="utf-8")

          variable_line = 'let requestMatchesEtag: (headers: Headers, etag: string) => boolean;\n'
          assert test_source.count(variable_line) == 1, "test variable insertion point missing"
          test_source = test_source.replace(
              variable_line,
              variable_line + 'let handleCoreAttachmentDownload: typeof import("../src/routes/attachments-core").handleDownloadAttachment;\n',
              1,
          )

          import_line = '  const [attachmentsModule, schemaModule, thumbnailsModule, etagModule] = await Promise.all([\n'
          assert test_source.count(import_line) == 1, "test import declaration changed unexpectedly"
          test_source = test_source.replace(
              import_line,
              '  const [attachmentsModule, attachmentsCoreModule, schemaModule, thumbnailsModule, etagModule] = await Promise.all([\n',
              1,
          )
          first_dynamic_import = '    import("../src/routes/attachments"),\n'
          assert test_source.count(first_dynamic_import) == 1, "attachments import changed unexpectedly"
          test_source = test_source.replace(
              first_dynamic_import,
              first_dynamic_import + '    import("../src/routes/attachments-core"),\n',
              1,
          )

          assignment_line = '  requestMatchesEtag = etagModule.requestMatchesEtag;\n'
          assert test_source.count(assignment_line) == 1, "test assignment insertion point missing"
          test_source = test_source.replace(
              assignment_line,
              assignment_line + '  handleCoreAttachmentDownload = attachmentsCoreModule.handleDownloadAttachment;\n',
              1,
          )

          regression_test = r'''

          test("remote thumbnail failure reuses the already-read source buffer", async (t) => {
            if (!isThumbnailable("image/png")) {
              t.skip("当前平台未启用图片缩略图 MIME 路径");
              return;
            }

            const backupPath = `${attachmentPath}.remote-thumbnail-fallback-backup`;
            fs.renameSync(attachmentPath, backupPath);
            let objectReads = 0;
            let thumbnailAttempts = 0;
            const coreApp = new Hono();
            coreApp.get("/attachments/:id", (c) => handleCoreAttachmentDownload(c, {
              readAttachmentObject: async (storagePath) => {
                objectReads += 1;
                assert.ok(storagePath);
                return PNG_BYTES;
              },
              getOrCreateThumbnailFromBufferAsync: async (
                _attachmentsDir,
                id,
                source,
                mimeType,
                width,
              ) => {
                thumbnailAttempts += 1;
                assert.equal(id, attachmentId);
                assert.equal(mimeType, "image/png");
                assert.equal(width, 240);
                assert.deepEqual(source, PNG_BYTES);
                return null;
              },
            }));

            try {
              const response = await coreApp.request(signedRoute(signedUrl, { w: "240" }));
              assert.equal(response.status, 200);
              assert.equal(response.headers.get("content-type"), "image/png");
              assert.equal(response.headers.get("x-thumbnail-width"), null);
              assert.match(response.headers.get("etag") || "", /-original"$/);
              assert.deepEqual(Buffer.from(await response.arrayBuffer()), PNG_BYTES);
              assert.equal(thumbnailAttempts, 1);
              assert.equal(objectReads, 1, "缩略图失败回退原图不得再次读取远程对象");
            } finally {
              fs.renameSync(backupPath, attachmentPath);
            }
          });
          '''
          marker = "remote thumbnail failure reuses the already-read source buffer"
          assert marker not in test_source, "regression test already exists"
          test_source += regression_test
          test_path.write_text(test_source, encoding="utf-8")

          workflow_path = Path(".github/workflows/attachment-cache-contract-ci.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          shared_test = '          tests/attachment-shared-access.test.ts\n'
          assert workflow.count(shared_test) == 1, "attachment CI test list changed unexpectedly"
          workflow = workflow.replace(
              shared_test,
              shared_test + '          tests/attachments-inline-video.test.ts\n',
              1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue-690-fix.yml
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add backend/src/routes/attachments-core.ts \
                  backend/tests/attachment-cache-contract.test.ts \
                  .github/workflows/attachment-cache-contract-ci.yml \
                  .github/workflows/issue-690-fix.yml
          git diff --cached --check
          git commit -m "fix(attachments): reuse remote source buffer on thumbnail fallback"
          git push origin HEAD:release/v1.4.6
