name: Issue 455 Hook Order Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_issue_455_hook_order.py'
      - '.github/workflows/issue-455-hook-order-fix.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python3 scripts/fix_issue_455_hook_order.py
      - run: rm scripts/fix_issue_455_hook_order.py
      - name: Commit hook-order fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/TiptapEditor.tsx scripts/fix_issue_455_hook_order.py
          git commit -m "fix(editor): keep format painter hooks unconditional"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
