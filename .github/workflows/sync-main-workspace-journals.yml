name: Sync Main Into Workspace Journals

on:
  push:
    branches:
      - feature/workspace-shared-journals-v5
    paths:
      - .github/workflows/sync-main-workspace-journals.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-shared-journals-v5
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "chore(journals): sync latest main"
          git push origin HEAD:feature/workspace-shared-journals-v5
