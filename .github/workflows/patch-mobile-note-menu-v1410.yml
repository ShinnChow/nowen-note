name: Apply mobile note menu viewport fix

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/patch-mobile-note-menu-v1410.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10

      - name: Make mobile note menu viewport-safe and denser
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/EditorPane.tsx")
          text = path.read_text(encoding="utf-8")

          old_container = 'className="absolute top-full right-0 mt-1 w-56 bg-app-elevated border border-app-border rounded-lg shadow-xl z-50 py-1 overflow-hidden"'
          new_container = '''className="absolute top-full right-0 mt-1 w-56 max-h-[calc(100vh-9rem)] bg-app-elevated border border-app-border rounded-lg shadow-xl z-50 py-1 overflow-x-hidden overflow-y-auto overscroll-contain"\n                  style={{\n                    maxHeight: "calc(100dvh - 9rem - env(safe-area-inset-bottom, 0px))",\n                    WebkitOverflowScrolling: "touch",\n                  }}'''
          if text.count(old_container) != 1:
              raise SystemExit(f"expected one mobile menu container, found {text.count(old_container)}")
          text = text.replace(old_container, new_container, 1)

          start_marker = new_container
          end_marker = "<span>{t('editor.trashTooltip')}</span>"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          block = text[start:end]
          compact_count = block.count("py-2.5")
          if compact_count < 10:
              raise SystemExit(f"expected at least 10 mobile menu rows, found {compact_count}")
          block = block.replace("py-2.5", "py-2")
          text = text[:start] + block + text[end:]

          path.write_text(text, encoding="utf-8")
          print(f"compacted {compact_count} mobile menu rows")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-mobile-note-menu-v1410.yml
          git add frontend/src/components/EditorPane.tsx
          git diff --cached --check
          git commit -m "fix: adapt mobile note menu to short viewports"
          git push origin HEAD:release/v1.4.10
