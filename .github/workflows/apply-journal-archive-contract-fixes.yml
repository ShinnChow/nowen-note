name: Apply Journal Archive Contract Fixes

on:
  push:
    branches: [feature/journal-entity-archive-v2]
    paths:
      - 'scripts/apply-journal-archive-contract-fixes.mjs'
      - '.github/workflows/apply-journal-archive-contract-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/journal-entity-archive-v2
          fetch-depth: 0
      - name: Apply deterministic contract fixes
        run: node scripts/apply-journal-archive-contract-fixes.mjs
      - name: Commit product code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/routes/journals.ts frontend/src/lib/api.impl.ts
          if git diff --cached --quiet; then
            echo "Journal contract fixes already applied"
            exit 0
          fi
          git commit -m "fix(journals): refresh archive state across creation entrypoints"
          git push origin HEAD:feature/journal-entity-archive-v2
