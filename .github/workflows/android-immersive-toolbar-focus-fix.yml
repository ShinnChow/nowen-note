name: Android Immersive Toolbar Focus Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_android_immersive_toolbar_focus.py'
      - '.github/workflows/android-immersive-toolbar-focus-fix.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python3 scripts/fix_android_immersive_toolbar_focus.py
      - run: rm scripts/fix_android_immersive_toolbar_focus.py
      - name: Commit final focus fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/TiptapEditor.tsx \
                  frontend/src/components/MarkdownEditorImpl.tsx \
                  frontend/src/lib/__tests__/androidImmersiveEditorContract.test.ts \
                  scripts/fix_android_immersive_toolbar_focus.py
          git commit -m "fix(android): preserve editor focus in immersive toolbar"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
