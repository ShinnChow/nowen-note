name: PostgreSQL Schema View Parity Command

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/pg-schema-view-parity-trigger"

permissions:
  contents: write

concurrency:
  group: pg-schema-view-parity-command
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PostgreSQL migration branch
        uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recognize PostgreSQL views as schema relations
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pg-migration-unified
          git reset --hard origin/pg-migration-unified

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check-pg-schema-parity.mjs")
          source = path.read_text()
          old = r'''  const pattern = /\bCREATE\s+(?:VIRTUAL\s+)?TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(["'`\[]?[A-Za-z_][A-Za-z0-9_]*["'`\]]?)/gi;'''
          new = r'''  const pattern = /\bCREATE\s+(?:OR\s+REPLACE\s+)?(?:(?:VIRTUAL\s+)?TABLE|(?:MATERIALIZED\s+)?VIEW)\s+(?:IF\s+NOT\s+EXISTS\s+)?(["'`\[]?[A-Za-z_][A-Za-z0-9_]*["'`\]]?)/gi;'''
          if old not in source:
              raise SystemExit("schema relation pattern anchor missing")
          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          node scripts/check-pg-schema-parity.mjs --report-json /tmp/pg-schema-parity-report.json
          git add scripts/check-pg-schema-parity.mjs
          git commit -m "fix(postgres): include views in schema parity"
          git push origin HEAD:pg-migration-unified
