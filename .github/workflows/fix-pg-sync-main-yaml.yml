name: Fix pg-sync-main workflow syntax

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pg-sync-main-yaml.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair invalid multiline publish command
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('.github/workflows/pg-sync-main.yml')
          text = path.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one invalid publish block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/fix-pg-sync-main-yaml.yml
          git config user.name 'Drug'
          git config user.email 'cropflre2333@gmail.com'
          git add .github/workflows/pg-sync-main.yml .github/workflows/fix-pg-sync-main-yaml.yml
          git commit -m 'fix(ci): repair PostgreSQL sync workflow YAML'
          git pull --rebase origin main
          git push origin HEAD:main
