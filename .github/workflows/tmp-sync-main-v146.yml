name: Temporary Main Sync v1.4.6

on:
  push:
    branches:
      - chore/sync-main-into-release-v1.4.6
    paths:
      - .github/workflows/tmp-sync-main-v146.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-sync-main-v146
  cancel-in-progress: false

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release integration branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-main-into-release-v1.4.6
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts; resolving the reviewed overlap set."
          fi

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(backend/src/index\.ts|backend/src/runtime/knowledge-tree\.ts|frontend/package\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected conflicts:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          if printf '%s\n' "$conflicts" | grep -qx 'backend/src/index.ts'; then
            git checkout --ours backend/src/index.ts
          fi
          python3 <<'PY'
          from pathlib import Path

          path = Path('backend/src/index.ts')
          text = path.read_text()

          ack_block = '''app.post("/api/task-reminders/recent/ack", async (c) => {
            const userId = c.req.header("X-User-Id");
            if (!userId) return c.json({ error: "Unauthorized" }, 401);
            const body = await c.req.json().catch(() => ({}));
            const ids = new Set(
              (Array.isArray(body?.reminderIds) ? body.reminderIds : [])
                .filter((id: unknown): id is string => typeof id === "string" && id.length > 0)
                .slice(0, 200),
            );
            let acked = 0;
            for (let i = recentReminders.length - 1; i >= 0; i -= 1) {
              const item = recentReminders[i];
              if (item.userId !== userId || !ids.has(item.reminderId)) continue;
              if (item.type === "task_reminder") markReminderNotified(item.reminderId);
              recentReminders.splice(i, 1);
              acked += 1;
            }
            return c.json({ success: true, acked });
          });
          '''
          route_marker = 'app.route("/api/task-reminders", taskRemindersRouter);'
          if 'task-reminders/recent/ack' not in text:
              if route_marker not in text:
                  raise SystemExit('task reminder route marker not found')
              text = text.replace(route_marker, ack_block + route_marker, 1)

          old_loop = '''    for (const r of pending) {
              console.log(`[reminder] Task "${r.taskTitle}" (${r.taskId}) reminder due for user ${r.userId}`);
              recentReminders.push({ ...r, _triggeredAt: now, type: "task_reminder" });
              markReminderNotified(r.reminderId);
            }
          '''
          new_loop = '''    for (const r of pending) {
              if (recentReminders.some((item) => item.type === "task_reminder" && item.reminderId === r.reminderId && item.userId === r.userId)) {
                continue;
              }
              console.log(`[reminder] Task "${r.taskTitle}" (${r.taskId}) reminder due for user ${r.userId}`);
              recentReminders.push({ ...r, _triggeredAt: now, type: "task_reminder" });
            }
          '''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif 'recentReminders.some((item) => item.type === "task_reminder"' not in text:
              raise SystemExit('task reminder scan loop marker not found')

          path.write_text(text)
          PY
          git add backend/src/index.ts

          if printf '%s\n' "$conflicts" | grep -qx 'backend/src/runtime/knowledge-tree.ts'; then
            git checkout --theirs backend/src/runtime/knowledge-tree.ts
          fi
          python3 <<'PY'
          from pathlib import Path

          path = Path('backend/src/runtime/knowledge-tree.ts')
          text = path.read_text()

          import_line = 'import { fileOrphanVisibilityMiddleware } from "./file-orphan-visibility.js";\n'
          if import_line not in text:
              marker = 'import { enforceKnowledgePermissionPolicies } from "../middleware/knowledgePermissionPolicyGuard.js";\n'
              if marker not in text:
                  raise SystemExit('knowledge permission import marker not found')
              text = text.replace(marker, marker + import_line, 1)

          old = '''  const wrapper = new Hono<any>();
            wrapper.use("*", middleware);
            wrapper.route("/", subApp);
          '''
          new = '''  const wrapper = new Hono<any>();
            wrapper.use("*", middleware);
            if (normalized === "/api/files") {
              // Keep the release branch orphan/source-note visibility correction after access filtering.
              wrapper.use("*", fileOrphanVisibilityMiddleware);
            }
            wrapper.route("/", subApp);
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'wrapper.use("*", fileOrphanVisibilityMiddleware);' not in text:
              raise SystemExit('knowledge route wrapper marker not found')

          path.write_text(text)
          PY
          git add backend/src/runtime/knowledge-tree.ts

          if printf '%s\n' "$conflicts" | grep -qx 'frontend/package.json'; then
            git checkout --ours frontend/package.json
          fi
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'frontend/package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies ||= {}
          pkg.devDependencies ||= {}
          pkg.dependencies['@capacitor/local-notifications'] = '^8.0.0'
          pkg.devDependencies['@capacitor/cli'] = '^8.3.1'
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          git add frontend/package.json

          remaining="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

          rm -f .github/workflows/tmp-sync-main-v146.yml
          git add -A

          git diff --cached --check
          git commit -m "chore: merge main into release/v1.4.6"
          git push origin HEAD:chore/sync-main-into-release-v1.4.6
