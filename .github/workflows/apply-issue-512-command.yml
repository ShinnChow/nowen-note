name: Apply issue 512 command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: apply-issue-512-command
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.number == 512 && github.event.comment.body == '/apply-issue-512'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and run implementation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-issue-512.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          block = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          script = '\n'.join(line[indent:] if line.strip() else '' for line in block) + '\n'
          Path('/tmp/apply_issue_512.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_issue_512.py

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Validate backend types
        run: npm --prefix backend run build:tsc

      - name: Run knowledge tree regression
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/knowledge-tree.test.ts

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/KnowledgeTreePanel.tsx \
                  frontend/src/components/KnowledgeTreeNodeMenu.tsx \
                  backend/src/services/knowledgeTreeCore.ts \
                  backend/src/db/knowledgeTreeMigrationCore.ts \
                  backend/src/db/postgres/060_knowledge_tree.sql \
                  backend/src/routes/notebooks.ts \
                  backend/tests/knowledge-tree.test.ts
          git commit -m "feat: support root tree documents and create menu" -m "Closes #512"
          git pull --rebase origin main
          git push origin HEAD:main
