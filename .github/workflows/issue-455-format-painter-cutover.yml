name: Issue 455 Format Painter Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_issue_455_format_painter.py'
      - '.github/workflows/issue-455-format-painter-cutover.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply safe format painter UI integration
        id: patch
        continue-on-error: true
        run: python3 scripts/patch_issue_455_format_painter.py > patch-output.log 2>&1
      - name: Upload patch diagnostics
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: issue-455-format-painter-patch-diagnostics
          path: patch-output.log
          if-no-files-found: error
      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Remove one-shot patch script
        run: rm scripts/patch_issue_455_format_painter.py
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/TiptapEditor.tsx \
                  scripts/patch_issue_455_format_painter.py
          git commit -m "feat(editor): integrate safe one-shot format painter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
