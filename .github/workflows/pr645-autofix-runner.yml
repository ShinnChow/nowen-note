name: PR 645 Autofix Runner

on:
  push:
    branches:
      - fix/issue-643-workspace-acl-enforcement
    paths:
      - .github/pr645-autofix-trigger

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply authorization fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr645-autofix.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'pr645-autofix.py', 'exec'))
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent
      - name: Run authorization regressions
        working-directory: backend
        run: node --import tsx --test tests/knowledge-tree-query-limits.test.ts tests/knowledge-tree-restricted-access.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr645-autofix.yml
          rm .github/workflows/pr645-autofix-runner.yml
          rm .github/pr645-autofix-trigger
          git add -A
          git commit -m "fix: 完成团队空间权限链路收口"
          git push origin HEAD:${GITHUB_REF_NAME}
