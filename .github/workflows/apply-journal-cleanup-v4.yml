name: Apply Journal Cleanup V4

on:
  push:
    branches:
      - feature/journal-cleanup-natural-dates-v4
    paths:
      - scripts/apply-journal-cleanup-v4.mjs
      - .github/workflows/apply-journal-cleanup-v4.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/journal-cleanup-natural-dates-v4
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply deterministic integration patch
        run: node scripts/apply-journal-cleanup-v4.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent

      - name: Run backend cleanup regressions
        working-directory: backend
        run: |
          npx tsx --test tests/journal-archive-cleanup.test.ts
          npx tsx --test tests/journal-archive-cleanup-routes.test.ts
          npm run build:tsc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      - name: Run frontend date and cleanup regressions
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/dailyRecordCommandDefinitions.test.ts
          src/components/daily-records/__tests__/dailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/markdownDailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/journalArchiveCleanupContract.test.ts
          src/components/__tests__/SlashCommandExtension.test.ts

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Vite production bundle
        working-directory: frontend
        run: npx vite build

      - name: Commit integrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/journals.ts frontend/src/lib/api.impl.ts frontend/src/components/daily-records/DailyJournalView.tsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(journals): expose safe cleanup and rollback"
          git push origin HEAD:feature/journal-cleanup-natural-dates-v4
