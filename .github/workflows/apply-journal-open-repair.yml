name: Apply Journal Open Repair

on:
  push:
    branches: [feature/journal-entity-archive-v2]
    paths:
      - 'scripts/apply-journal-open-repair.mjs'
      - '.github/workflows/apply-journal-open-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/journal-entity-archive-v2
          fetch-depth: 0
      - name: Apply explicit open repair
        run: node scripts/apply-journal-open-repair.mjs
      - name: Commit product code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/daily-records/DailyJournalView.tsx
          if git diff --cached --quiet; then
            echo "Journal open repair already applied"
            exit 0
          fi
          git commit -m "fix(journals): repair archive before opening daily entries"
          git push origin HEAD:feature/journal-entity-archive-v2
