name: Apply Daily Journal Scope Patch

on:
  push:
    branches: [feature/daily-records-hub]
    paths:
      - 'scripts/apply-daily-journal-scope.mjs'
      - '.github/workflows/apply-daily-journal-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-records-hub
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic journal scope patch
        run: node scripts/apply-daily-journal-scope.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Daily records tests
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/dailyRecords.test.ts
          src/components/daily-records/__tests__/dailyRecordSlashCommands.test.tsx
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Commit product code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/daily-records/DailyJournalView.tsx
          if git diff --cached --quiet; then
            echo "Journal scope patch already applied"
            exit 0
          fi
          git commit -m "fix(daily-records): preserve personal journal scope"
          git push origin HEAD:feature/daily-records-hub
