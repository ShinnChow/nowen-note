name: Fix offline attachment priority and recovery

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/fix-offline-attachment-priority-v1410.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10
          fetch-depth: 0

      - name: Apply attachment cache recovery fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          bridge = Path("frontend/src/lib/noteAttachmentAccessBridge.ts")
          replace_once(
              bridge,
              'import { getOfflineAttachmentsByNote, markOfflineAttachmentsAccessed } from "@/lib/localStore";\n',
              '''import {\n  deleteOfflineAttachment,\n  getOfflineAttachment,\n  getOfflineAttachmentsByNote,\n  markOfflineAttachmentsAccessed,\n  putOfflineAttachmentJob,\n} from "@/lib/localStore";\n''',
              "local store imports",
          )
          replace_once(
              bridge,
              'const INSTALL_KEY = "__NOWEN_NOTE_ATTACHMENT_ACCESS_BRIDGE_V1__";\n',
              'const INSTALL_KEY = "__NOWEN_NOTE_ATTACHMENT_ACCESS_BRIDGE_V1__";\nexport const OFFLINE_ATTACHMENT_RETRY_EVENT = "nowen:offline-attachment-retry-requested";\n',
              "retry event constant",
          )
          replace_once(
              bridge,
              '''const accessUrls = new Map<string, string>();\nconst offlineObjectUrls = new Map<string, string>();\n''',
              '''const accessUrls = new Map<string, string>();\nconst offlineObjectUrls = new Map<string, string>();\n// Online rendering must prefer the server. This set is populated only after a real\n// network image failure, allowing a cached Blob to act as a fallback for that attachment.\nconst offlineFallbackAttachmentIds = new Set<string>();\n''',
              "offline fallback state",
          )
          replace_once(
              bridge,
              '''function isKnownNowenApiUrl(url: URL): boolean {\n  return /\\/api\\/(?:notes|attachments|files|shared)(?:\\/|$)/.test(url.pathname);\n}\n\nfunction currentWindowHttpOrigin(): string {''',
              '''function isKnownNowenApiUrl(url: URL): boolean {\n  return /\\/api\\/(?:notes|attachments|files|shared)(?:\\/|$)/.test(url.pathname);\n}\n\nfunction browserOnline(): boolean {\n  return typeof navigator === "undefined" || navigator.onLine !== false;\n}\n\nfunction currentWindowHttpOrigin(): string {''',
              "browser online helper",
          )
          replace_once(
              bridge,
              '''  window.addEventListener("pagehide", () => {\n    forceRevokeAllOfflineObjectUrls();\n  });''',
              '''  window.addEventListener("online", () => {\n    if (offlineFallbackAttachmentIds.size === 0) return;\n    offlineFallbackAttachmentIds.clear();\n    notifyAttachmentAccessChanged();\n    queueDomScan();\n  });\n  window.addEventListener("pagehide", () => {\n    forceRevokeAllOfflineObjectUrls();\n  });''',
              "online retry listener",
          )
          replace_once(
              bridge,
              '''    if (accessUrls.get(id) !== normalized) changed = true;\n    accessUrls.set(id, normalized);''',
              '''    if (accessUrls.get(id) !== normalized) {\n      changed = true;\n      // A refreshed signed URL is a new network attempt; do not remain pinned to a\n      // temporary offline fallback from an earlier request failure.\n      offlineFallbackAttachmentIds.delete(id);\n    }\n    accessUrls.set(id, normalized);''',
              "signed url refresh clears fallback",
          )
          replace_once(
              bridge,
              '''function retireOfflineObjectUrl(id: string): boolean {\n  const current = offlineObjectUrls.get(id);\n  if (!current) return false;\n  offlineObjectUrls.delete(id);\n  offlineObjectBlobMetadata.delete(id);''',
              '''function retireOfflineObjectUrl(id: string): boolean {\n  const current = offlineObjectUrls.get(id);\n  if (!current) return false;\n  offlineObjectUrls.delete(id);\n  offlineObjectBlobMetadata.delete(id);\n  offlineFallbackAttachmentIds.delete(id);''',
              "retire clears fallback",
          )
          replace_once(
              bridge,
              '''  accessUrls.clear();\n  attachmentApiOrigin = "";\n  for (const id of [...offlineObjectUrls.keys()]) retireOfflineObjectUrl(id);''',
              '''  accessUrls.clear();\n  offlineFallbackAttachmentIds.clear();\n  attachmentApiOrigin = "";\n  for (const id of [...offlineObjectUrls.keys()]) retireOfflineObjectUrl(id);''',
              "session reset clears fallback",
          )
          replace_once(
              bridge,
              '''export function resolveAttachmentAccessUrl(raw: string): string {\n  const persistent = getPersistentAttachmentUrl(raw);\n  const id = persistent ? extractAttachmentId(persistent) : null;\n  if (!id) return raw;\n  const offline = offlineObjectUrls.get(id);\n  if (offline) return offline;\n  const signed = accessUrls.get(id);\n  const stableSource = extractAttachmentId(raw) ? raw : persistent!;\n  if (signed) return mergeSignedAttachmentUrl(stableSource, signed);\n\n  // 旧正文可能已被污染为 http://127.0.0.1:3001/api/attachments/...\n  // 即使签名映射尚未返回，只要本会话已经观察到真实 API origin，就先修正 host。\n  const parsed = asAbsoluteUrl(stableSource);\n  if (\n    parsed\n    && attachmentApiOrigin\n    && isLoopbackHostname(parsed.hostname)\n    && parsed.origin !== attachmentApiOrigin\n  ) {\n    return moveUrlToOrigin(parsed, attachmentApiOrigin).toString();\n  }\n  return stableSource;\n}\n''',
              '''export function resolveAttachmentAccessUrl(raw: string): string {\n  const persistent = getPersistentAttachmentUrl(raw);\n  const id = persistent ? extractAttachmentId(persistent) : null;\n  if (!id) return raw;\n\n  const offline = offlineObjectUrls.get(id);\n  const signed = accessUrls.get(id);\n  const stableSource = extractAttachmentId(raw) ? raw : persistent!;\n\n  // Offline blobs are a resilience layer, not the primary online source. While the\n  // browser is online, prefer the current signed server URL. If that request actually\n  // fails, the image component explicitly opts this attachment into the cached fallback.\n  if ((!browserOnline() || offlineFallbackAttachmentIds.has(id)) && offline) return offline;\n  if (signed) return mergeSignedAttachmentUrl(stableSource, signed);\n\n  // 旧正文可能已被污染为 http://127.0.0.1:3001/api/attachments/...\n  // 即使签名映射尚未返回，只要本会话已经观察到真实 API origin，就先修正 host。\n  const parsed = asAbsoluteUrl(stableSource);\n  if (\n    parsed\n    && attachmentApiOrigin\n    && isLoopbackHostname(parsed.hostname)\n    && parsed.origin !== attachmentApiOrigin\n  ) {\n    return moveUrlToOrigin(parsed, attachmentApiOrigin).toString();\n  }\n  return stableSource;\n}\n\n/**\n * A network image request failed while a valid offline Blob is available. Switch only\n * this attachment to the local fallback. A new signed URL or an `online` event clears\n * the override so healthy network data becomes primary again.\n */\nexport function fallbackToOfflineAttachmentRenderUrl(value: string): boolean {\n  const persistent = getPersistentAttachmentUrl(value);\n  const id = persistent ? extractAttachmentId(persistent) : null;\n  if (!id) return false;\n  const offline = offlineObjectUrls.get(id);\n  if (!offline || value === offline) return false;\n  offlineFallbackAttachmentIds.add(id);\n  notifyAttachmentAccessChanged();\n  queueDomScan();\n  return true;\n}\n''',
              "online first resolution",
          )
          replace_once(
              bridge,
              '''export function getAttachmentRenderSource(raw: string | null | undefined): AttachmentRenderSource {\n  const original = raw || "";\n  const persistent = getPersistentAttachmentUrl(original) || original;\n  const attachmentId = extractAttachmentId(persistent);\n  const offlineUrl = attachmentId ? offlineObjectUrls.get(attachmentId) : undefined;\n  return {\n    attachmentId,\n    persistentSrc: persistent,\n    resolvedSrc: resolveAttachmentAccessUrl(original),\n    offlineObjectUrlHit: !!offlineUrl,\n    signedUrlPresent: !!(attachmentId && accessUrls.has(attachmentId)),\n    accessStateRevision,\n  };\n}\n''',
              '''export function getAttachmentRenderSource(raw: string | null | undefined): AttachmentRenderSource {\n  const original = raw || "";\n  const persistent = getPersistentAttachmentUrl(original) || original;\n  const attachmentId = extractAttachmentId(persistent);\n  const offlineUrl = attachmentId ? offlineObjectUrls.get(attachmentId) : undefined;\n  const resolvedSrc = resolveAttachmentAccessUrl(original);\n  return {\n    attachmentId,\n    persistentSrc: persistent,\n    resolvedSrc,\n    offlineObjectUrlHit: !!offlineUrl && resolvedSrc === offlineUrl,\n    signedUrlPresent: !!(attachmentId && accessUrls.has(attachmentId)),\n    accessStateRevision,\n  };\n}\n''',
              "accurate offline source flag",
          )
          replace_once(
              bridge,
              '''export function invalidateOfflineAttachmentRenderUrl(value: string): boolean {\n  const entry = offlineObjectUrlEntries.get(value);\n  if (!entry || entry.retired || offlineObjectUrls.get(entry.id) !== value) return false;\n  retireOfflineObjectUrl(entry.id);\n  notifyAttachmentAccessChanged();\n  queueDomScan();\n  return true;\n}\n''',
              '''export function invalidateOfflineAttachmentRenderUrl(value: string): boolean {\n  const entry = offlineObjectUrlEntries.get(value);\n  if (!entry || entry.retired || offlineObjectUrls.get(entry.id) !== value) return false;\n  const attachmentId = entry.id;\n  retireOfflineObjectUrl(attachmentId);\n  notifyAttachmentAccessChanged();\n  queueDomScan();\n\n  // A Blob URL that reaches <img onError> is not a usable offline copy. Remove the\n  // persisted record as well and recreate its download job so the next/active sync can\n  // self-heal instead of hydrating the same broken Blob every time the note is opened.\n  void (async () => {\n    const record = await getOfflineAttachment(attachmentId);\n    if (!record) return;\n    await deleteOfflineAttachment(attachmentId);\n    await putOfflineAttachmentJob({\n      id: record.id,\n      noteId: record.noteId,\n      filename: record.filename,\n      mimeType: record.mimeType,\n      size: record.size,\n      createdAt: record.createdAt,\n      queuedAt: Date.now(),\n      retryCount: 0,\n      lastError: "本地离线附件无法解码，等待重新下载",\n    });\n    if (typeof window !== "undefined") {\n      window.dispatchEvent(new CustomEvent(OFFLINE_ATTACHMENT_RETRY_EVENT, {\n        detail: { attachmentId },\n      }));\n    }\n  })().catch((error) => {\n    console.warn("[attachment-access] failed to quarantine offline attachment", error);\n  });\n  return true;\n}\n''',
              "quarantine broken offline blob",
          )
          replace_once(
              bridge,
              '''  accessUrls.clear();\n  forceRevokeAllOfflineObjectUrls();\n  attachmentApiOrigin = "";''',
              '''  accessUrls.clear();\n  offlineFallbackAttachmentIds.clear();\n  forceRevokeAllOfflineObjectUrls();\n  attachmentApiOrigin = "";''',
              "test reset clears fallback",
          )

          image_view = Path("frontend/src/components/ResizableImageView.tsx")
          replace_once(
              image_view,
              '''  getAttachmentAccessSnapshot,\n  invalidateOfflineAttachmentRenderUrl,\n  subscribeAttachmentAccess,''',
              '''  getAttachmentAccessSnapshot,\n  fallbackToOfflineAttachmentRenderUrl,\n  invalidateOfflineAttachmentRenderUrl,\n  subscribeAttachmentAccess,''',
              "rich text fallback import",
          )
          replace_once(
              image_view,
              '''            if (recoveredFromOfflineObjectUrl) {\n              setFailedSrc(null);\n              return;\n            }\n            // 错误状态绑定到触发失败的地址，不能覆盖随后切换成功的新地址。\n            setFailedSrc(finalSrc);''',
              '''            if (recoveredFromOfflineObjectUrl) {\n              setFailedSrc(null);\n              return;\n            }\n            if (fallbackToOfflineAttachmentRenderUrl(finalSrc)) {\n              setFailedSrc(null);\n              return;\n            }\n            // 错误状态绑定到触发失败的地址，不能覆盖随后切换成功的新地址。\n            setFailedSrc(finalSrc);''',
              "rich text network to offline fallback",
          )

          markdown = Path("frontend/src/components/MarkdownPreview.tsx")
          replace_once(
              markdown,
              '''  getAttachmentAccessSnapshot,\n  invalidateOfflineAttachmentRenderUrl,\n  subscribeAttachmentAccess,''',
              '''  getAttachmentAccessSnapshot,\n  fallbackToOfflineAttachmentRenderUrl,\n  invalidateOfflineAttachmentRenderUrl,\n  subscribeAttachmentAccess,''',
              "markdown fallback import",
          )
          replace_once(
              markdown,
              '''        onError={() => {\n          if (invalidateOfflineAttachmentRenderUrl(resolvedSrc)) {\n            setFailedSrc(null);\n            return;\n          }\n          setFailedSrc(resolvedSrc);\n        }}''',
              '''        onError={() => {\n          if (invalidateOfflineAttachmentRenderUrl(resolvedSrc)) {\n            setFailedSrc(null);\n            return;\n          }\n          if (fallbackToOfflineAttachmentRenderUrl(resolvedSrc)) {\n            setFailedSrc(null);\n            return;\n          }\n          setFailedSrc(resolvedSrc);\n        }}''',
              "markdown network to offline fallback",
          )

          sync = Path("frontend/src/lib/offlineWorkspaceSync.ts")
          replace_once(
              sync,
              '''  if (\n    existing\n    && existing.size === attachment.size\n    && existing.mimeType === attachment.mimeType\n    && existing.filename === attachment.filename\n  ) return "existing";''',
              '''  if (\n    existing\n    && existing.size === attachment.size\n    && existing.blob.size === attachment.size\n    && existing.mimeType === attachment.mimeType\n    && existing.filename === attachment.filename\n  ) return "existing";''',
              "existing cache byte validation",
          )
          replace_once(
              sync,
              '''  const blob = await fetchAttachmentBlob(attachment, signal);\n  const record: OfflineAttachmentRecord = {\n    ...attachment,\n    size: blob.size || attachment.size,\n    blob,\n    cachedAt: Date.now(),\n  };''',
              '''  const blob = await fetchAttachmentBlob(attachment, signal);\n  if (attachment.size > 0 && blob.size !== attachment.size) {\n    throw new Error(\n      `离线附件校验失败：服务端声明 ${attachment.size} 字节，实际下载 ${blob.size} 字节`,\n    );\n  }\n  const record: OfflineAttachmentRecord = {\n    ...attachment,\n    // Never disguise an empty/truncated Blob as the manifest size. Old code used\n    // `blob.size || attachment.size`, which could make a 0-byte cache look complete.\n    size: blob.size,\n    blob,\n    cachedAt: Date.now(),\n  };''',
              "downloaded blob integrity check",
          )
          replace_once(
              sync,
              '''    const current = !!existing\n      && existing.size === attachment.size\n      && existing.mimeType === attachment.mimeType\n      && existing.filename === attachment.filename;''',
              '''    const current = !!existing\n      && existing.size === attachment.size\n      && existing.blob.size === attachment.size\n      && existing.mimeType === attachment.mimeType\n      && existing.filename === attachment.filename;''',
              "queue cache byte validation",
          )

          runtime = Path("frontend/src/components/OfflineSyncRuntime.tsx")
          replace_once(
              runtime,
              '''import { SYNC_SNAPSHOT_APPLIED_EVENT } from "@/lib/syncEngine";\n''',
              '''import { SYNC_SNAPSHOT_APPLIED_EVENT } from "@/lib/syncEngine";\nimport { syncOfflineWorkspace } from "@/lib/offlineWorkspaceSync";\nimport { OFFLINE_ATTACHMENT_RETRY_EVENT } from "@/lib/noteAttachmentAccessBridge";\n''',
              "runtime recovery imports",
          )
          replace_once(
              runtime,
              '''  useEffect(() => {\n    const handleSnapshot = () => {''',
              '''  useEffect(() => {\n    const handleAttachmentRetry = () => {\n      void syncOfflineWorkspace({ force: true, reason: "network" });\n    };\n    window.addEventListener(OFFLINE_ATTACHMENT_RETRY_EVENT, handleAttachmentRetry);\n    return () => window.removeEventListener(OFFLINE_ATTACHMENT_RETRY_EVENT, handleAttachmentRetry);\n  }, []);\n\n  useEffect(() => {\n    const handleSnapshot = () => {''',
              "runtime recovery listener",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-offline-attachment-priority-v1410.yml
          git add \
            frontend/src/lib/noteAttachmentAccessBridge.ts \
            frontend/src/components/ResizableImageView.tsx \
            frontend/src/components/MarkdownPreview.tsx \
            frontend/src/lib/offlineWorkspaceSync.ts \
            frontend/src/components/OfflineSyncRuntime.tsx
          git diff --cached --check
          git commit -m "fix: prefer online attachments and repair bad offline cache"
          for attempt in 1 2 3; do
            git pull --rebase origin release/v1.4.10
            if git push origin HEAD:release/v1.4.10; then
              exit 0
            fi
            sleep 2
          done
          exit 1
