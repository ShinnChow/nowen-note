name: Apply Diary Link Preview Fix

on:
  push:
    branches:
      - release/v1.4.6
    paths:
      - ".github/workflows/tmp-apply-diary-link-preview.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.6
          fetch-depth: 0

      - name: Patch daily journal preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/daily-records/DailyJournalView.tsx')
          source = path.read_text(encoding='utf-8-sig')

          import_anchor = 'import { confirm as confirmDialog } from "@/components/ui/confirm";\n'
          import_replacement = (
              'import { confirm as confirmDialog } from "@/components/ui/confirm";\n'
              'import DailyJournalContentPreview from "@/components/daily-records/DailyJournalContentPreview";\n'
          )
          if import_anchor not in source:
              raise SystemExit('DailyJournalView import anchor not found')
          source = source.replace(import_anchor, import_replacement, 1)

          old = '''              {journal ? (
                <button
                  type="button"
                  onClick={() => void createOrOpenJournal()}
                  disabled={creating}
                  className="block min-h-[190px] w-full px-5 py-5 text-left hover:bg-app-hover/20 disabled:opacity-70"
                >
                  {preview ? (
                    <p className="whitespace-pre-wrap text-sm leading-7 text-tx-secondary">{preview}</p>
                  ) : (
                    <div className="flex min-h-[130px] flex-col items-center justify-center text-center">
                      <Sparkles size={24} className="mb-2 text-accent-primary/60" />
                      <p className="text-sm text-tx-secondary">这一天还没有正文</p>
                      <p className="mt-1 text-xs text-tx-tertiary">点击开始记录或整理当天的瞬间</p>
                    </div>
                  )}
                  <div className="mt-4 flex items-center gap-2 text-[11px] text-tx-tertiary">
                    <Clock3 size={12} />
                    <span>{journal.updatedAt ? `更新于 ${new Date(journal.updatedAt).toLocaleString()}` : ""}</span>
                  </div>
                </button>
              ) : (
'''
          new = '''              {journal ? (
                <div className="min-h-[190px]">
                  {preview ? (
                    <DailyJournalContentPreview
                      note={journal}
                      onOpenEditor={() => void createOrOpenJournal()}
                      className={creating ? "pointer-events-none opacity-70" : undefined}
                    />
                  ) : (
                    <button
                      type="button"
                      onClick={() => void createOrOpenJournal()}
                      disabled={creating}
                      className="flex min-h-[150px] w-full flex-col items-center justify-center px-5 py-5 text-center hover:bg-app-hover/20 disabled:opacity-70"
                    >
                      <Sparkles size={24} className="mb-2 text-accent-primary/60" />
                      <p className="text-sm text-tx-secondary">这一天还没有正文</p>
                      <p className="mt-1 text-xs text-tx-tertiary">点击开始记录或整理当天的瞬间</p>
                    </button>
                  )}
                  <div className="flex items-center gap-2 border-t border-app-border/70 px-5 py-3 text-[11px] text-tx-tertiary">
                    <Clock3 size={12} />
                    <span>{journal.updatedAt ? `更新于 ${new Date(journal.updatedAt).toLocaleString()}` : ""}</span>
                  </div>
                </div>
              ) : (
'''
          if old not in source:
              raise SystemExit('DailyJournalView preview block anchor not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate frontend
        run: |
          npm ci
          npm ci --prefix frontend
          npm run test:run --prefix frontend -- --run frontend/src/components/daily-records/__tests__/dailyJournalContentPreview.test.tsx
          npm run build --prefix frontend

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/tmp-apply-diary-link-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/daily-records/DailyJournalView.tsx .github/workflows/tmp-apply-diary-link-preview.yml
          git commit -m "fix(diary): preserve links in journal content preview"
          git push origin HEAD:release/v1.4.6
