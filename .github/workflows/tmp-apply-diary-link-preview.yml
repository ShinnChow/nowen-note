name: Apply Diary Link Preview Fix

on:
  push:
    branches:
      - release/v1.4.6
    paths:
      - ".github/workflows/tmp-apply-diary-link-preview.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.6
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/patch-diary-link-preview.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run regression test
        run: npm run test:run --prefix frontend -- src/components/daily-records/__tests__/dailyJournalContentPreview.test.tsx

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/tmp-apply-diary-link-preview.yml
          rm scripts/patch-diary-link-preview.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/daily-records/DailyJournalView.tsx .github/workflows/tmp-apply-diary-link-preview.yml scripts/patch-diary-link-preview.mjs
          git commit -m "fix(diary): preserve links in journal content preview"
          git push origin HEAD:release/v1.4.6
