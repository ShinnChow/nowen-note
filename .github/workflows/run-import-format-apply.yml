name: Run import format implementation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-import-format-options.yml"
      - ".github/workflows/run-import-format-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run staged implementation
        shell: bash
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/apply-import-format-options.yml")
            step = workflow.fetch("jobs").fetch("apply").fetch("steps").find { |item| item["name"] == "Apply implementation" }
            abort "Apply implementation step not found" unless step && step["run"]
            File.write("/tmp/apply-import-formats.sh", step["run"])
          '
          bash /tmp/apply-import-formats.sh
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run targeted tests
        working-directory: frontend
        run: npm run test:run -- src/lib/__tests__/importServiceSiyuanMarkdown.test.ts src/lib/__tests__/obsidianImportFormat.test.ts
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-import-format-options.yml .github/workflows/run-import-format-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(import): add target format options"
          git push origin HEAD:${{ github.head_ref }}
