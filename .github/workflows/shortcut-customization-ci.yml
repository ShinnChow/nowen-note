name: Shortcut Customization CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/lib/shortcutRegistry.ts'
      - 'frontend/src/lib/shortcutOverrides.ts'
      - 'frontend/src/lib/shortcuts/**'
      - 'frontend/src/lib/__tests__/shortcut*.test.ts'
      - 'frontend/src/components/ShortcutRuntimeBridge.tsx'
      - 'frontend/src/components/ShortcutHelpCenter.tsx'
      - 'frontend/src/components/settings/ShortcutSettingsPanel.tsx'
      - 'frontend/src/components/SettingsModal.tsx'
      - 'electron/menu.js'
      - '.github/workflows/shortcut-customization-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
      - name: Shortcut registry and override tests
        run: npx vitest run --reporter=basic src/lib/__tests__/shortcutRegistry.test.ts src/lib/__tests__/shortcutOverrides.test.ts
      - name: Frontend typecheck
        run: npm run typecheck --silent
