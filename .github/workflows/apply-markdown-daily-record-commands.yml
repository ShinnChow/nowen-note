name: Apply Markdown Daily Record Commands

on:
  push:
    branches:
      - feature/markdown-daily-record-commands-v3
    paths:
      - scripts/apply-markdown-daily-record-commands.mjs
      - .github/workflows/apply-markdown-daily-record-commands.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-markdown-daily-record-commands.mjs
      - .github/workflows/apply-markdown-daily-record-commands.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/markdown-daily-record-commands-v3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic integration patch
        run: node scripts/apply-markdown-daily-record-commands.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      - name: Run daily record command regressions
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/dailyRecordCommandDefinitions.test.ts
          src/components/daily-records/__tests__/dailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/markdownDailyRecordSlashCommands.test.tsx
          src/components/__tests__/SlashCommandExtension.test.ts

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Vite production bundle
        working-directory: frontend
        run: npx vite build

      - name: Commit integrated editor file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/MarkdownEditorImpl.tsx
          if git diff --cached --quiet; then
            echo "No editor integration changes to commit"
            exit 0
          fi
          git commit -m "feat(markdown): register daily record slash commands"
          git push origin HEAD:feature/markdown-daily-record-commands-v3
