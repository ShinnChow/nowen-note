name: Apply Shortcut Customization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shortcut-customization
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 scripts/applyShortcutCustomization.py
      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(shortcuts): integrate customization runtime and settings"
          git push origin HEAD:agent/shortcut-customization
