name: Apply mobile video upload fix

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/patch-mobile-video-upload-v1410.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10

      - name: Fix native multipart media uploads
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Multipart uploads on native Capacitor must bypass the CapacitorHttp fetch patch.
          upload_request = Path("frontend/src/lib/uploadRequest.ts")
          replace_once(
              upload_request,
              'export const LOCAL_ATTACHMENT_UPLOAD_TIMEOUT_MS = 20_000;\n',
              '''export const LOCAL_ATTACHMENT_UPLOAD_TIMEOUT_MS = 20_000;\nexport const NATIVE_ATTACHMENT_UPLOAD_MIN_TIMEOUT_MS = 90_000;\nexport const NATIVE_ATTACHMENT_UPLOAD_MAX_TIMEOUT_MS = 10 * 60_000;\n\nexport function isNativeCapacitorUploadRuntime(): boolean {\n  if (typeof window === "undefined") return false;\n  try {\n    return Boolean((window as any).Capacitor?.isNativePlatform?.());\n  } catch {\n    return false;\n  }\n}\n\n/**\n * Native uploads travel over cellular / WAN much more often than desktop uploads.\n * A fixed 20s deadline aborts otherwise healthy video uploads, so scale the deadline\n * with the selected file while keeping a hard upper bound.\n */\nexport function getAttachmentUploadTimeoutMs(\n  fileSize: number,\n  native = isNativeCapacitorUploadRuntime(),\n): number {\n  if (!native) return LOCAL_ATTACHMENT_UPLOAD_TIMEOUT_MS;\n  const safeBytes = Number.isFinite(fileSize) && fileSize > 0 ? fileSize : 0;\n  const sizeMiB = safeBytes / (1024 * 1024);\n  const scaled = 45_000 + Math.ceil(sizeMiB) * 4_000;\n  return Math.min(\n    NATIVE_ATTACHMENT_UPLOAD_MAX_TIMEOUT_MS,\n    Math.max(NATIVE_ATTACHMENT_UPLOAD_MIN_TIMEOUT_MS, scaled),\n  );\n}\n\n/**\n * CapacitorHttp patches window.fetch when enabled. Its multipart/FormData bridge has\n * platform-specific binary conversion behaviour, which is especially fragile for\n * gallery videos. Capacitor keeps the original WebView fetch as CapacitorWebFetch;\n * Nowen's backend explicitly allows the native WebView origins via CORS, so multipart\n * uploads can safely use the original browser transport while all other requests keep\n * the native HTTP patch.\n */\nexport function resolveUploadFetch(body: BodyInit | null | undefined): typeof globalThis.fetch {\n  if (\n    typeof window !== "undefined"\n    && typeof FormData !== "undefined"\n    && body instanceof FormData\n  ) {\n    const webFetch = (window as Window & { CapacitorWebFetch?: typeof globalThis.fetch }).CapacitorWebFetch;\n    if (typeof webFetch === "function") return webFetch;\n  }\n  return globalThis.fetch;\n}\n''',
              "upload transport helpers",
          )
          replace_once(
              upload_request,
              '    const response = await fetch(url, { ...init, signal: controller.signal });',
              '    const requestFetch = resolveUploadFetch(init.body);\n    const response = await requestFetch(url, { ...init, signal: controller.signal });',
              "use original fetch for multipart",
          )

          # 2) Use size-aware native deadline at the attachment API boundary.
          api_path = Path("frontend/src/lib/api.ts")
          replace_once(
              api_path,
              '''  LOCAL_ATTACHMENT_UPLOAD_TIMEOUT_MS,\n  UploadRequestError,''',
              '''  getAttachmentUploadTimeoutMs,\n  UploadRequestError,''',
              "api upload timeout import",
          )
          replace_once(
              api_path,
              '      timeoutMs: LOCAL_ATTACHMENT_UPLOAD_TIMEOUT_MS,',
              '      timeoutMs: getAttachmentUploadTimeoutMs(file.size),',
              "api upload timeout",
          )

          # 3) Make queue status matching stable across Android DataTransfer File wrappers,
          #    and display SI MB/GB consistently with phone file managers.
          media_path = Path("frontend/src/lib/mediaExperience.ts")
          replace_once(
              media_path,
              '''export function formatMediaBytes(bytes: number): string {\n  if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";\n  const units = ["B", "KB", "MB", "GB"];\n  let value = bytes;\n  let index = 0;\n  while (value >= 1024 && index < units.length - 1) {\n    value /= 1024;\n    index += 1;\n  }\n  const digits = index === 0 || value >= 10 ? 0 : 1;\n  return `${value.toFixed(digits)} ${units[index]}`;\n}\n''',
              '''export function mediaFileFingerprint(\n  file: Pick<Blob, "size" | "type"> & { name?: string; lastModified?: number },\n): string {\n  return [\n    file.name || "",\n    Number.isFinite(file.size) ? file.size : 0,\n    (file.type || "").toLowerCase(),\n    Number.isFinite(file.lastModified) ? file.lastModified : 0,\n  ].join("\\u0000");\n}\n\nexport function formatMediaBytes(bytes: number): string {\n  if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";\n  // The UI labels are KB/MB/GB (SI), matching Android/iOS/Windows file managers.\n  // The previous 1024 divisor was actually KiB/MiB/GiB and made mobile sizes look wrong.\n  const units = ["B", "KB", "MB", "GB"];\n  let value = bytes;\n  let index = 0;\n  while (value >= 1000 && index < units.length - 1) {\n    value /= 1000;\n    index += 1;\n  }\n  const digits = index === 0 || value >= 10 ? 0 : 1;\n  return `${value.toFixed(digits)} ${units[index]}`;\n}\n''',
              "media size formatting and fingerprint",
          )

          bridge_path = Path("frontend/src/components/MediaExperienceBridge.tsx")
          text = bridge_path.read_text(encoding="utf-8")
          old_import = '''  formatMediaBytes,\n  formatMediaDuration,\n  prepareMediaFiles,'''
          new_import = '''  formatMediaBytes,\n  formatMediaDuration,\n  mediaFileFingerprint,\n  prepareMediaFiles,'''
          if text.count(old_import) != 1:
              raise SystemExit("MediaExperienceBridge import block mismatch")
          text = text.replace(old_import, new_import, 1)
          text = text.replace(
              '''type QueueItem = PreparedMediaFile & {\n  previewUrl: string;\n  validationError: boolean;\n};''',
              '''type QueueItem = PreparedMediaFile & {\n  previewUrl: string;\n  validationError: boolean;\n  /** Server-confirmed byte size after upload; preferred over provider metadata in the UI. */\n  uploadedSize?: number;\n};''',
              1,
          )
          old_listener = '''  useEffect(() => listenMediaUploadLifecycle((detail) => {\n    setItems((previous) => previous.map((item) => {\n      if (item.file !== detail.file) return item;\n      if (detail.phase === "start") return { ...item, status: "uploading", error: undefined };\n      if (detail.phase === "success") return { ...item, status: "success", error: undefined };\n      return { ...item, status: "error", error: detail.error || "上传失败" };\n    }));'''
          new_listener = '''  useEffect(() => listenMediaUploadLifecycle((detail) => {\n    setItems((previous) => {\n      const fingerprint = mediaFileFingerprint(detail.file);\n      let matched = false;\n      return previous.map((item) => {\n        if (matched) return item;\n        const sameFile = item.file === detail.file\n          || mediaFileFingerprint(item.file) === fingerprint;\n        if (!sameFile) return item;\n\n        // DataTransfer may wrap the same native file in a new File object on Android.\n        // Match only the first item in the expected phase so duplicate selections still\n        // advance one-by-one rather than all changing state at once.\n        if (detail.phase === "start" && item.status !== "ready" && item.status !== "error") return item;\n        if (detail.phase !== "start" && item.status !== "uploading" && item.file !== detail.file) return item;\n        matched = true;\n\n        if (detail.phase === "start") {\n          return { ...item, status: "uploading", error: undefined };\n        }\n        if (detail.phase === "success") {\n          const result = detail.result as { size?: unknown } | undefined;\n          const serverSize = typeof result?.size === "number" && Number.isFinite(result.size) && result.size > 0\n            ? result.size\n            : undefined;\n          return { ...item, status: "success", error: undefined, uploadedSize: serverSize };\n        }\n        return { ...item, status: "error", error: detail.error || "上传失败" };\n      });\n    });'''
          if text.count(old_listener) != 1:
              raise SystemExit(f"MediaExperienceBridge lifecycle block mismatch: {text.count(old_listener)}")
          text = text.replace(old_listener, new_listener, 1)
          text = text.replace(
              'totalBytes: valid.reduce((sum, item) => sum + item.file.size, 0),',
              'totalBytes: valid.reduce((sum, item) => sum + (item.uploadedSize ?? item.file.size), 0),',
              1,
          )
          text = text.replace(
              '{item.kind === "video" ? "视频" : item.kind === "image" ? "图片" : "不支持"} · {formatMediaBytes(item.file.size)}',
              '{item.kind === "video" ? "视频" : item.kind === "image" ? "图片" : "不支持"} · {formatMediaBytes(item.uploadedSize ?? item.file.size)}',
              1,
          )
          bridge_path.write_text(text, encoding="utf-8")

          # 4) Never insert a video node when the server confirms a different byte count.
          #    This turns silent/truncated transport corruption into a visible retryable failure.
          media_upload_path = Path("frontend/src/lib/mediaUploadService.ts")
          replace_once(
              media_upload_path,
              '''    const uploaded = await api.attachments.upload(noteId, file);\n    const result: MediaUploadResult = {''',
              '''    const uploaded = await api.attachments.upload(noteId, file);\n    if (\n      file.size > 0\n      && Number.isFinite(uploaded.size)\n      && uploaded.size > 0\n      && uploaded.size !== file.size\n    ) {\n      throw new Error(`视频上传校验失败：本地 ${file.size} 字节，服务端 ${uploaded.size} 字节，请重试`);\n    }\n    const result: MediaUploadResult = {''',
              "video byte-size integrity check",
          )

          # 5) Minimal regression coverage for native timeout scaling and SI display.
          test_path = Path("frontend/src/lib/__tests__/uploadRequest.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              '''  fetchJsonWithUploadDeadline,\n  isElectronFullLocalRuntime,''',
              '''  fetchJsonWithUploadDeadline,\n  getAttachmentUploadTimeoutMs,\n  isElectronFullLocalRuntime,''',
              1,
          )
          marker = '''  it("rejects explicit offline uploads only for remote runtimes", () => {\n    expect(shouldRejectRemoteOffline(false, false)).toBe(true);\n    expect(shouldRejectRemoteOffline(false, true)).toBe(false);\n    expect(shouldRejectRemoteOffline(true, false)).toBe(false);\n    expect(shouldRejectRemoteOffline(undefined, false)).toBe(false);\n  });\n'''
          addition = marker + '''\n  it("gives native media uploads a longer size-aware deadline", () => {\n    expect(getAttachmentUploadTimeoutMs(1 * 1024 * 1024, false)).toBe(20_000);\n    expect(getAttachmentUploadTimeoutMs(1 * 1024 * 1024, true)).toBe(90_000);\n    expect(getAttachmentUploadTimeoutMs(100 * 1024 * 1024, true)).toBeGreaterThan(90_000);\n    expect(getAttachmentUploadTimeoutMs(10 * 1024 * 1024 * 1024, true)).toBe(10 * 60_000);\n  });\n'''
          if test_text.count(marker) != 1:
              raise SystemExit("uploadRequest test marker mismatch")
          test_path.write_text(test_text.replace(marker, addition, 1), encoding="utf-8")
          PY

          # Focused tests only; do not run the full suite/build here.
          cd frontend
          npx vitest run src/lib/__tests__/uploadRequest.test.ts src/lib/__tests__/mediaUploadService.test.ts --reporter=dot
          cd ..

      - name: Commit fix, rebase latest branch, and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-mobile-video-upload-v1410.yml
          git add \
            frontend/src/lib/uploadRequest.ts \
            frontend/src/lib/api.ts \
            frontend/src/lib/mediaExperience.ts \
            frontend/src/components/MediaExperienceBridge.tsx \
            frontend/src/lib/mediaUploadService.ts \
            frontend/src/lib/__tests__/uploadRequest.test.ts
          git diff --cached --check
          git commit -m "fix: stabilize mobile video uploads"
          for attempt in 1 2 3; do
            git pull --rebase origin release/v1.4.10
            if git push origin HEAD:release/v1.4.10; then
              exit 0
            fi
            sleep 2
          done
          exit 1
