name: PostgreSQL Knowledge Tree Read Command

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/pg-sync-latest-main-trigger"

permissions:
  contents: write

concurrency:
  group: pg-knowledge-tree-read-command
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - name: Checkout PostgreSQL migration branch
        uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Implement and validate knowledge-tree read runtime
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pg-migration-unified
          git reset --hard origin/pg-migration-unified

          cat src/db/postgres/060_knowledge_tree.sql > src/db/postgres/migrations/0015_knowledge_tree_read_runtime.sql
          cat >> src/db/postgres/migrations/0015_knowledge_tree_read_runtime.sql <<'SQL'
          -- Issue #370 v61: PostgreSQL resource compatibility for mixed tree nodes.
          CREATE TABLE IF NOT EXISTS mindmaps (
              id TEXT PRIMARY KEY,
              "userId" TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
              "workspaceId" TEXT,
              title TEXT NOT NULL DEFAULT '无标题导图',
              data TEXT NOT NULL DEFAULT '{}',
              starred BOOLEAN NOT NULL DEFAULT false,
              "folderId" TEXT,
              "createdAt" TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX IF NOT EXISTS idx_mindmaps_user ON mindmaps("userId");
          CREATE INDEX IF NOT EXISTS idx_mindmaps_updated ON mindmaps("updatedAt" DESC);
          CREATE INDEX IF NOT EXISTS idx_mindmaps_workspace ON mindmaps("workspaceId");

          DO $$
          BEGIN
            IF to_regclass('public.files') IS NULL THEN
              EXECUTE 'CREATE VIEW files AS SELECT id, filename FROM attachments';
            END IF;
          END
          $$;
          SQL
          cat src/db/postgres/063_knowledge_tree_legacy_sync.sql >> src/db/postgres/migrations/0015_knowledge_tree_read_runtime.sql
          cat src/db/postgres/064_knowledge_tree_structural_guard.sql >> src/db/postgres/migrations/0015_knowledge_tree_read_runtime.sql
          cat >> src/db/postgres/migrations/0015_knowledge_tree_read_runtime.sql <<'SQL'
          -- Issue #370 v65: password-protected knowledge folders.
          CREATE TABLE IF NOT EXISTS notebook_passwords (
              "notebookId" TEXT PRIMARY KEY REFERENCES notebooks(id) ON DELETE CASCADE,
              "passwordHash" TEXT NOT NULL,
              "passwordVersion" INTEGER NOT NULL DEFAULT 1,
              "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL

          cat > src/repositories/knowledgeTreeReadRepository.ts <<'EOF'
          import type { DatabaseAdapter } from "../db/adapters/types";
          import { convertSql, type DatabaseDialect } from "../db/dialect";
          import { getDatabaseAdapter, getDatabaseDialect } from "../db/runtime";
          import type {
            EffectiveKnowledgeAccess,
            KnowledgeCapabilities,
            KnowledgeRolePreset,
          } from "../services/knowledgeCapabilitiesCore";
          import type { KnowledgeTreeNode } from "../services/knowledgeTreeCore";

          const ROOT_DOCUMENT_NOTEBOOK_PREFIX = "__nowen_root_documents__:";
          const ROOT_DOCUMENT_NODE_PREFIX = `notebook:${ROOT_DOCUMENT_NOTEBOOK_PREFIX}`;

          type DatabaseScalar = boolean | number | string | Date | null;

          type ListedNodeRow = {
            id: string;
            userId: string;
            workspaceId: string | null;
            scopeKey: string;
            parentId: string | null;
            nodeType: KnowledgeTreeNode["nodeType"];
            resourceType: KnowledgeTreeNode["resourceType"];
            resourceId: string;
            sortOrder: DatabaseScalar;
            isExpanded: DatabaseScalar;
            isDeleted: DatabaseScalar;
            deletedAt: DatabaseScalar;
            createdAt: DatabaseScalar;
            updatedAt: DatabaseScalar;
            title: string;
            icon: string | null;
            isPinned: DatabaseScalar;
            isFavorite: DatabaseScalar;
            isLocked: DatabaseScalar;
            isPasswordProtected: DatabaseScalar;
            contentFormat: string | null;
            childCount: DatabaseScalar;
            aclNodeId: string | null;
            aclRolePreset: KnowledgeRolePreset | null;
            aclCanView: DatabaseScalar;
            aclCanComment: DatabaseScalar;
            aclCanCreate: DatabaseScalar;
            aclCanEdit: DatabaseScalar;
            aclCanDelete: DatabaseScalar;
            aclCanMove: DatabaseScalar;
            aclCanDownload: DatabaseScalar;
            aclCanReshare: DatabaseScalar;
            aclCanManageMembers: DatabaseScalar;
            aclDepth: DatabaseScalar;
            workspaceOwnerId: string | null;
            workspaceRole: string | null;
            notebookRole: string | null;
            noteNotebookRole: string | null;
            notePermission: string | null;
          };

          export type KnowledgeTreeReadNode = KnowledgeTreeNode & {
            deletedAt?: string | null;
          };

          const NONE: KnowledgeCapabilities = {
            canView: false,
            canComment: false,
            canCreate: false,
            canEdit: false,
            canDelete: false,
            canMove: false,
            canDownload: false,
            canReshare: false,
            canManageMembers: false,
          };

          const ROLE_PRESETS: Record<KnowledgeRolePreset, KnowledgeCapabilities> = {
            readonly: {
              ...NONE,
              canView: true,
              canDownload: true,
            },
            editor: {
              ...NONE,
              canView: true,
              canComment: true,
              canCreate: true,
              canEdit: true,
              canDownload: true,
            },
            maintainer: {
              ...NONE,
              canView: true,
              canComment: true,
              canCreate: true,
              canEdit: true,
              canDelete: true,
              canMove: true,
              canDownload: true,
            },
            admin: {
              canView: true,
              canComment: true,
              canCreate: true,
              canEdit: true,
              canDelete: true,
              canMove: true,
              canDownload: true,
              canReshare: true,
              canManageMembers: true,
            },
          };

          const TITLE_EXPRESSION = `CASE
            WHEN node.resourceType = 'notebook' THEN COALESCE(nb.name, '未命名文件夹')
            WHEN node.resourceType = 'note' THEN COALESCE(note.title, '无标题笔记')
            WHEN node.resourceType = 'mindmap' THEN COALESCE(mm.title, node.resourceId)
            WHEN node.resourceType = 'file' THEN COALESCE(file.filename, node.resourceId)
            ELSE node.resourceId
          END`;

          function cloneCapabilities(capabilities: KnowledgeCapabilities): KnowledgeCapabilities {
            return { ...capabilities };
          }

          function toBoolean(value: DatabaseScalar): boolean {
            return value === true || value === 1 || value === "1" || value === "t" || value === "true";
          }

          function toNumber(value: DatabaseScalar): number {
            if (value === null) return 0;
            if (value === true) return 1;
            if (value === false) return 0;
            const numeric = Number(value);
            return Number.isFinite(numeric) ? numeric : 0;
          }

          function toTimestamp(value: DatabaseScalar): string {
            if (value instanceof Date) return value.toISOString();
            return value === null ? "" : String(value);
          }

          function toOptionalTimestamp(value: DatabaseScalar): string | null {
            if (value === null) return null;
            return toTimestamp(value);
          }

          function legacyPermission(role: string | null): Pick<EffectiveKnowledgeAccess, "rolePreset" | "capabilities"> {
            if (role === "manage" || role === "admin" || role === "owner") {
              return { rolePreset: "admin", capabilities: cloneCapabilities(ROLE_PRESETS.admin) };
            }
            if (role === "write" || role === "editor") {
              return { rolePreset: "editor", capabilities: cloneCapabilities(ROLE_PRESETS.editor) };
            }
            if (role === "comment" || role === "commenter") {
              return {
                rolePreset: "commenter",
                capabilities: { ...ROLE_PRESETS.readonly, canComment: true },
              };
            }
            if (role === "read" || role === "viewer") {
              return { rolePreset: "readonly", capabilities: cloneCapabilities(ROLE_PRESETS.readonly) };
            }
            return { rolePreset: "none", capabilities: cloneCapabilities(NONE) };
          }

          function explicitCapabilities(row: ListedNodeRow): KnowledgeCapabilities {
            return {
              canView: toBoolean(row.aclCanView),
              canComment: toBoolean(row.aclCanComment),
              canCreate: toBoolean(row.aclCanCreate),
              canEdit: toBoolean(row.aclCanEdit),
              canDelete: toBoolean(row.aclCanDelete),
              canMove: toBoolean(row.aclCanMove),
              canDownload: toBoolean(row.aclCanDownload),
              canReshare: toBoolean(row.aclCanReshare),
              canManageMembers: toBoolean(row.aclCanManageMembers),
            };
          }

          function resolveAccess(row: ListedNodeRow, userId: string): EffectiveKnowledgeAccess {
            const ownsPersonalNode = !row.workspaceId && row.userId === userId;
            const ownsWorkspace = Boolean(row.workspaceId && row.workspaceOwnerId === userId);
            if (ownsPersonalNode || ownsWorkspace) {
              return {
                nodeId: row.id,
                rolePreset: "admin",
                capabilities: cloneCapabilities(ROLE_PRESETS.admin),
                source: "owner",
                sourceNodeId: row.id,
              };
            }

            if (row.aclNodeId && row.aclRolePreset) {
              return {
                nodeId: row.id,
                rolePreset: row.aclRolePreset,
                capabilities: explicitCapabilities(row),
                source: toNumber(row.aclDepth) === 0 ? "direct" : "inherited",
                sourceNodeId: row.aclNodeId,
              };
            }

            let role: string | null = null;
            if (row.resourceType === "notebook") {
              role = row.notebookRole;
            } else if (row.resourceType === "note") {
              role = row.noteNotebookRole || row.notePermission;
            }
            role ||= row.workspaceRole;

            const legacy = legacyPermission(role);
            return {
              nodeId: row.id,
              ...legacy,
              source: legacy.rolePreset === "none" ? "none" : "legacy",
              sourceNodeId: null,
            };
          }

          function scopeKey(userId: string, workspaceId: string | null): string {
            return workspaceId ? `workspace:${workspaceId}` : `personal:${userId}`;
          }

          function resolveAdapter(adapter?: DatabaseAdapter): DatabaseAdapter {
            return adapter ?? getDatabaseAdapter();
          }

          function resolveDialect(dialect?: DatabaseDialect): DatabaseDialect {
            if (dialect) return dialect;
            try {
              return getDatabaseDialect();
            } catch {
              return "sqlite";
            }
          }

          function listSql(includeDeleted: boolean): string {
            return `
              WITH RECURSIVE
              viewer(userId) AS (SELECT ?),
              scope_nodes AS (
                SELECT node.id, node.userId, node.workspaceId, node.scopeKey, node.parentId,
                       node.nodeType, node.resourceType, node.resourceId, node.sortOrder,
                       node.isExpanded, node.isDeleted, node.deletedAt, node.createdAt, node.updatedAt
                FROM knowledge_tree_nodes node
                WHERE node.scopeKey = ? ${includeDeleted ? "" : "AND node.isDeleted = 0"}
              ),
              ancestors(nodeId, ancestorId, parentId, depth) AS (
                SELECT node.id, node.id, node.parentId, 0
                FROM scope_nodes node
                UNION ALL
                SELECT ancestors.nodeId, parent.id, parent.parentId, ancestors.depth + 1
                FROM ancestors
                JOIN knowledge_tree_nodes parent ON parent.id = ancestors.parentId
                WHERE ancestors.parentId IS NOT NULL
              ),
              ranked_acl AS (
                SELECT ancestors.nodeId,
                       acl.nodeId AS aclNodeId,
                       acl.rolePreset AS aclRolePreset,
                       acl.canView AS aclCanView,
                       acl.canComment AS aclCanComment,
                       acl.canCreate AS aclCanCreate,
                       acl.canEdit AS aclCanEdit,
                       acl.canDelete AS aclCanDelete,
                       acl.canMove AS aclCanMove,
                       acl.canDownload AS aclCanDownload,
                       acl.canReshare AS aclCanReshare,
                       acl.canManageMembers AS aclCanManageMembers,
                       ancestors.depth AS aclDepth,
                       ROW_NUMBER() OVER (
                         PARTITION BY ancestors.nodeId
                         ORDER BY ancestors.depth ASC
                       ) AS rn
                FROM ancestors
                JOIN knowledge_tree_acl acl ON acl.nodeId = ancestors.ancestorId
                CROSS JOIN viewer
                WHERE acl.userId = viewer.userId
              )
              SELECT node.id, node.userId, node.workspaceId, node.scopeKey, node.parentId,
                     node.nodeType, node.resourceType, node.resourceId, node.sortOrder,
                     node.isExpanded, node.isDeleted, node.deletedAt, node.createdAt, node.updatedAt,
                     ${TITLE_EXPRESSION} AS title,
                     CASE WHEN node.resourceType = 'notebook' THEN nb.icon ELSE NULL END AS icon,
                     CASE WHEN node.resourceType = 'note' AND note.isPinned THEN 1 ELSE 0 END AS isPinned,
                     CASE WHEN favorite.noteId IS NOT NULL THEN 1 ELSE 0 END AS isFavorite,
                     CASE WHEN node.resourceType = 'note' AND note.isLocked THEN 1 ELSE 0 END AS isLocked,
                     CASE WHEN notebook_password.notebookId IS NOT NULL THEN 1 ELSE 0 END AS isPasswordProtected,
                     CASE WHEN node.resourceType = 'note' THEN note.contentFormat ELSE NULL END AS contentFormat,
                     (
                       SELECT COUNT(*)
                       FROM knowledge_tree_nodes child
                       WHERE child.parentId = node.id AND child.isDeleted = 0
                     ) AS childCount,
                     explicit.aclNodeId, explicit.aclRolePreset,
                     explicit.aclCanView, explicit.aclCanComment, explicit.aclCanCreate,
                     explicit.aclCanEdit, explicit.aclCanDelete, explicit.aclCanMove,
                     explicit.aclCanDownload, explicit.aclCanReshare, explicit.aclCanManageMembers,
                     explicit.aclDepth,
                     workspace.ownerId AS workspaceOwnerId,
                     workspace_member.role AS workspaceRole,
                     notebook_member.role AS notebookRole,
                     note_notebook_member.role AS noteNotebookRole,
                     note_acl.permission AS notePermission
              FROM scope_nodes node
              CROSS JOIN viewer
              LEFT JOIN notebooks nb
                ON node.resourceType = 'notebook' AND nb.id = node.resourceId
              LEFT JOIN notebook_passwords notebook_password
                ON node.resourceType = 'notebook' AND notebook_password.notebookId = node.resourceId
              LEFT JOIN notes note
                ON node.resourceType = 'note' AND note.id = node.resourceId
              LEFT JOIN mindmaps mm
                ON node.resourceType = 'mindmap' AND mm.id = node.resourceId
              LEFT JOIN files file
                ON node.resourceType = 'file' AND file.id = node.resourceId
              LEFT JOIN favorites favorite
                ON node.resourceType = 'note'
               AND favorite.noteId = node.resourceId
               AND favorite.userId = viewer.userId
              LEFT JOIN ranked_acl explicit
                ON explicit.nodeId = node.id AND explicit.rn = 1
              LEFT JOIN workspaces workspace
                ON workspace.id = node.workspaceId
              LEFT JOIN workspace_members workspace_member
                ON workspace_member.workspaceId = node.workspaceId
               AND workspace_member.userId = viewer.userId
              LEFT JOIN notebook_members notebook_member
                ON node.resourceType = 'notebook'
               AND notebook_member.notebookId = node.resourceId
               AND notebook_member.userId = viewer.userId
               AND notebook_member.status != 'removed'
              LEFT JOIN notebook_members note_notebook_member
                ON node.resourceType = 'note'
               AND note_notebook_member.notebookId = note.notebookId
               AND note_notebook_member.userId = viewer.userId
               AND note_notebook_member.status != 'removed'
              LEFT JOIN note_acl note_acl
                ON node.resourceType = 'note'
               AND note_acl.noteId = node.resourceId
               AND note_acl.userId = viewer.userId
              ORDER BY
                CASE WHEN node.parentId IS NULL THEN 0 ELSE 1 END,
                node.parentId,
                node.sortOrder,
                lower(${TITLE_EXPRESSION}),
                node.id
            `;
          }

          export function createKnowledgeTreeReadRepository(
            adapter?: DatabaseAdapter,
            dialect?: DatabaseDialect,
          ) {
            const getAdapter = () => resolveAdapter(adapter);
            const getDialect = () => resolveDialect(dialect);

            return {
              async list(input: {
                userId: string;
                workspaceId: string | null;
                includeDeleted?: boolean;
              }): Promise<KnowledgeTreeReadNode[]> {
                const rows = await getAdapter().queryMany<ListedNodeRow>(
                  convertSql(listSql(Boolean(input.includeDeleted)), getDialect()),
                  [input.userId, scopeKey(input.userId, input.workspaceId)],
                );

                return rows
                  .filter((row) => !(
                    row.resourceType === "notebook"
                    && row.resourceId.startsWith(ROOT_DOCUMENT_NOTEBOOK_PREFIX)
                  ))
                  .map((row): KnowledgeTreeReadNode => {
                    const access = resolveAccess(row, input.userId);
                    return {
                      id: row.id,
                      userId: row.userId,
                      workspaceId: row.workspaceId,
                      scopeKey: row.scopeKey,
                      parentId: row.parentId?.startsWith(ROOT_DOCUMENT_NODE_PREFIX) ? null : row.parentId,
                      nodeType: row.nodeType,
                      resourceType: row.resourceType,
                      resourceId: row.resourceId,
                      title: row.title,
                      icon: row.icon,
                      isPinned: toNumber(row.isPinned),
                      isFavorite: toNumber(row.isFavorite),
                      isLocked: toNumber(row.isLocked),
                      isPasswordProtected: toNumber(row.isPasswordProtected),
                      contentFormat: row.contentFormat,
                      sortOrder: toNumber(row.sortOrder),
                      isExpanded: toNumber(row.isExpanded),
                      isDeleted: toNumber(row.isDeleted),
                      childCount: toNumber(row.childCount),
                      deletedAt: toOptionalTimestamp(row.deletedAt),
                      createdAt: toTimestamp(row.createdAt),
                      updatedAt: toTimestamp(row.updatedAt),
                      access,
                    };
                  })
                  .filter((row) => row.access.capabilities.canView);
              },
            };
          }

          export const knowledgeTreeReadRepository = createKnowledgeTreeReadRepository();
          EOF

          cat > src/routes/knowledge-tree-runtime.ts <<'EOF'
          import { Hono, type Context } from "hono";

          import type { DatabaseAdapter } from "../db/adapters/types";
          import type { DatabaseDialect } from "../db/dialect";
          import { createKnowledgeTreeReadRepository } from "../repositories/knowledgeTreeReadRepository";

          const ROLE_DEFINITIONS = [
            { id: "readonly", label: "只读成员", capabilities: ["canView", "canDownload"] },
            {
              id: "editor",
              label: "编辑成员",
              capabilities: ["canView", "canComment", "canCreate", "canEdit", "canDownload"],
            },
            {
              id: "maintainer",
              label: "维护成员",
              capabilities: [
                "canView",
                "canComment",
                "canCreate",
                "canEdit",
                "canDelete",
                "canMove",
                "canDownload",
              ],
            },
            {
              id: "admin",
              label: "管理员",
              capabilities: [
                "canView",
                "canComment",
                "canCreate",
                "canEdit",
                "canDelete",
                "canMove",
                "canDownload",
                "canReshare",
                "canManageMembers",
              ],
            },
          ] as const;

          function userIdOf(c: Context): string {
            return c.req.header("X-User-Id") || "";
          }

          function workspaceIdOf(c: Context): string | null {
            const value = c.req.query("workspaceId");
            return !value || value === "personal" ? null : value;
          }

          export default function createKnowledgeTreeRuntimeRouter(
            adapter: DatabaseAdapter,
            dialect: DatabaseDialect,
          ) {
            const app = new Hono();
            const repository = createKnowledgeTreeReadRepository(adapter, dialect);

            app.get("/roles", (c) => c.json({ roles: ROLE_DEFINITIONS }));

            app.get("/", async (c) => {
              try {
                const userId = userIdOf(c);
                if (!userId) {
                  return c.json({ error: "未授权，请先登录", code: "UNAUTHENTICATED" }, 401);
                }

                const nodes = await repository.list({
                  userId,
                  workspaceId: workspaceIdOf(c),
                  includeDeleted: c.req.query("includeDeleted") === "1",
                });
                return c.json({ nodes });
              } catch (error) {
                console.error(
                  "[knowledge-tree-runtime] list failed:",
                  error instanceof Error ? error.message : error,
                );
                return c.json(
                  { error: "知识树读取失败", code: "KNOWLEDGE_TREE_READ_FAILED" },
                  500,
                );
              }
            });

            return app;
          }
          EOF

          cat > tests/knowledge-tree-runtime-pg.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { Hono } from "hono";

          const databaseUrl = process.env.TEST_PG_DATABASE_URL;
          const skip = !databaseUrl;

          test("PostgreSQL knowledge-tree read runtime preserves access and response shapes", { skip }, async () => {
            const { Pool } = await import("pg");
            const pool = new Pool({ connectionString: databaseUrl });
            const runtime = await import("../src/db/runtime");

            await runtime.resetDatabaseRuntimeForTests();
            await runtime.initializeDatabase({
              env: {
                ...process.env,
                DB_DRIVER: "postgres",
                DATABASE_URL: databaseUrl,
              },
              dependencies: {
                createPostgresPool: () => pool,
                logger: { log: () => undefined, warn: () => undefined },
              },
            });

            const { runPostgresMigrations } = await import("../src/db/postgres/migrations");
            const applied = await runPostgresMigrations();
            assert(applied.some((migration) => migration.version === "0015_knowledge_tree_read_runtime"));

            const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const ownerId = `pg-tree-owner-${suffix}`;
            const editorId = `pg-tree-editor-${suffix}`;
            const outsiderId = `pg-tree-outsider-${suffix}`;
            const workspaceId = `pg-tree-ws-${suffix}`;
            const notebookId = `pg-tree-nb-${suffix}`;
            const noteId = `pg-tree-note-${suffix}`;

            for (const userId of [ownerId, editorId, outsiderId]) {
              await pool.query(
                `INSERT INTO users (id, username, "passwordHash") VALUES ($1, $2, $3)`,
                [userId, userId, "hash"],
              );
            }
            await pool.query(
              `INSERT INTO workspaces (id, name, "ownerId") VALUES ($1, $2, $3)`,
              [workspaceId, "Knowledge Runtime Workspace", ownerId],
            );
            await pool.query(
              `INSERT INTO workspace_members ("workspaceId", "userId", role) VALUES ($1, $2, 'editor')`,
              [workspaceId, editorId],
            );
            await pool.query(
              `INSERT INTO notebooks (id, "userId", name, "workspaceId", icon)
               VALUES ($1, $2, $3, $4, $5)`,
              [notebookId, ownerId, "Runtime Folder", workspaceId, "📁"],
            );
            await pool.query(
              `INSERT INTO notes (
                 id, "userId", "notebookId", title, "workspaceId", "contentFormat", "isPinned", "isLocked"
               ) VALUES ($1, $2, $3, $4, $5, 'markdown', true, true)`,
              [noteId, ownerId, notebookId, "Runtime Note", workspaceId],
            );
            await pool.query(
              `INSERT INTO favorites ("userId", "noteId", "workspaceId") VALUES ($1, $2, $3)`,
              [ownerId, noteId, workspaceId],
            );
            await pool.query(
              `INSERT INTO notebook_passwords ("notebookId", "passwordHash") VALUES ($1, $2)`,
              [notebookId, "password-hash"],
            );

            try {
              const { createKnowledgeTreeReadRepository } = await import(
                "../src/repositories/knowledgeTreeReadRepository"
              );
              const repository = createKnowledgeTreeReadRepository(
                runtime.getDatabaseAdapter(),
                "postgres",
              );

              const ownerNodes = await repository.list({ userId: ownerId, workspaceId });
              assert.equal(ownerNodes.length, 2);
              assert(ownerNodes.every((node) => node.access.rolePreset === "admin"));
              assert(ownerNodes.every((node) => node.access.source === "owner"));

              const ownerFolder = ownerNodes.find((node) => node.resourceId === notebookId);
              const ownerNote = ownerNodes.find((node) => node.resourceId === noteId);
              assert.equal(ownerFolder?.title, "Runtime Folder");
              assert.equal(ownerFolder?.icon, "📁");
              assert.equal(ownerFolder?.isPasswordProtected, 1);
              assert.equal(ownerFolder?.childCount, 1);
              assert.equal(ownerNote?.title, "Runtime Note");
              assert.equal(ownerNote?.contentFormat, "markdown");
              assert.equal(ownerNote?.isPinned, 1);
              assert.equal(ownerNote?.isLocked, 1);
              assert.equal(ownerNote?.isFavorite, 1);
              assert.equal(typeof ownerNote?.createdAt, "string");
              assert.equal(typeof ownerNote?.updatedAt, "string");

              const legacyEditorNodes = await repository.list({ userId: editorId, workspaceId });
              assert.equal(legacyEditorNodes.length, 2);
              assert(
                legacyEditorNodes.every(
                  (node) => node.access.rolePreset === "editor" && node.access.source === "legacy",
                ),
              );

              await pool.query(
                `INSERT INTO knowledge_tree_acl ("nodeId", "userId", "rolePreset")
                 VALUES ($1, $2, 'readonly')`,
                [`notebook:${notebookId}`, editorId],
              );

              const explicitNodes = await repository.list({ userId: editorId, workspaceId });
              const explicitFolder = explicitNodes.find((node) => node.resourceId === notebookId);
              const inheritedNote = explicitNodes.find((node) => node.resourceId === noteId);
              assert.equal(explicitFolder?.access.rolePreset, "readonly");
              assert.equal(explicitFolder?.access.source, "direct");
              assert.equal(explicitFolder?.access.sourceNodeId, `notebook:${notebookId}`);
              assert.equal(inheritedNote?.access.rolePreset, "readonly");
              assert.equal(inheritedNote?.access.source, "inherited");
              assert.equal(inheritedNote?.access.sourceNodeId, `notebook:${notebookId}`);
              assert.equal(inheritedNote?.access.capabilities.canEdit, false);

              assert.deepEqual(
                await repository.list({ userId: outsiderId, workspaceId }),
                [],
              );

              const { default: createKnowledgeTreeRuntimeRouter } = await import(
                "../src/routes/knowledge-tree-runtime"
              );
              const app = new Hono();
              app.route(
                "/api/knowledge-tree",
                createKnowledgeTreeRuntimeRouter(runtime.getDatabaseAdapter(), "postgres"),
              );

              const response = await app.request(
                `/api/knowledge-tree/?workspaceId=${encodeURIComponent(workspaceId)}`,
                { headers: { "X-User-Id": editorId } },
              );
              assert.equal(response.status, 200);
              const payload = await response.json() as { nodes: Array<{ resourceId: string }> };
              assert.deepEqual(
                payload.nodes.map((node) => node.resourceId).sort(),
                [notebookId, noteId].sort(),
              );
            } finally {
              await pool.query(`DELETE FROM knowledge_tree_acl WHERE "userId" = $1`, [editorId]);
              await pool.query(`DELETE FROM favorites WHERE "noteId" = $1`, [noteId]);
              await pool.query(`DELETE FROM notebook_passwords WHERE "notebookId" = $1`, [notebookId]);
              await pool.query(`DELETE FROM notes WHERE id = $1`, [noteId]);
              await pool.query(`DELETE FROM notebooks WHERE id = $1`, [notebookId]);
              await pool.query(`DELETE FROM workspace_members WHERE "workspaceId" = $1`, [workspaceId]);
              await pool.query(`DELETE FROM workspaces WHERE id = $1`, [workspaceId]);
              await pool.query(
                `DELETE FROM users WHERE id = ANY($1::text[])`,
                [[ownerId, editorId, outsiderId]],
              );
              await runtime.resetDatabaseRuntimeForTests();
            }
          });
          EOF

