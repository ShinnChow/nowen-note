name: Siyuan Import Feedback CI

on:
  pull_request:
    paths:
      - "frontend/src/main.tsx"
      - "frontend/src/components/SiyuanImportProgressBridge.tsx"
      - "frontend/src/components/__tests__/SiyuanImportProgressBridge.test.ts"
      - ".github/workflows/siyuan-import-feedback-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/main.tsx"
      - "frontend/src/components/SiyuanImportProgressBridge.tsx"
      - "frontend/src/components/__tests__/SiyuanImportProgressBridge.test.ts"
      - ".github/workflows/siyuan-import-feedback-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Siyuan zip detection and feedback tests
        run: npm run test:run -- src/components/__tests__/SiyuanImportProgressBridge.test.ts
      - name: Frontend typecheck
        run: npx tsc -b
