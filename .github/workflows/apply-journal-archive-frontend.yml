name: Apply Journal Archive Frontend

on:
  push:
    branches: [feature/journal-entity-archive-v2]
    paths:
      - 'scripts/apply-journal-archive-frontend.mjs'
      - '.github/workflows/apply-journal-archive-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/journal-entity-archive-v2
          fetch-depth: 0
      - name: Apply deterministic frontend patch
        run: node scripts/apply-journal-archive-frontend.mjs
      - name: Commit product frontend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/api.impl.ts frontend/src/components/daily-records/DailyJournalView.tsx
          if git diff --cached --quiet; then
            echo "Journal frontend integration already applied"
            exit 0
          fi
          git commit -m "feat(journals): expose archive migration in daily records"
          git push origin HEAD:feature/journal-entity-archive-v2
