function scanFor(markdown: string) {
  const file = new File([markdown], "Demo.md", { type: "text/markdown", lastModified: 1_700_000_000_000 });
  return {
    source: "folder" as const,
    rootFolderName: "Vault",
    entries: [{
      relPath: "Vault/Demo.md",
      vaultPath: "Demo.md",
      fileName: "Demo.md",
