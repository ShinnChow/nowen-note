name: Apply import format options

on:
  push:
    branches:
      - feat/import-target-format-options

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(import): add target format options') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-target-format-options
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: str, pattern: str, repl: str, flags: int = 0) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              next_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, found {count}: {pattern[:100]!r}')
              p.write_text(next_text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Shared import service: make the target format an explicit option.
          # ------------------------------------------------------------------
          replace_once(
              'frontend/src/lib/importService.base.ts',
              '}\n\n// 导入选项\nexport interface ImportOptions {',
              '}\n\nexport type ImportTargetContentFormat = "tiptap-json" | "markdown";\n\n// 导入选项\nexport interface ImportOptions {',
          )
          replace_once(
              'frontend/src/lib/importService.base.ts',
              '  workspaceId?: string;\n}',
              '  workspaceId?: string;\n  /**\n   * Markdown-capable sources can either stay native Markdown or be converted\n   * to the rich-text TipTap JSON format. Non-Markdown sources ignore this.\n   */\n  targetContentFormat?: ImportTargetContentFormat;\n}',
          )
          replace_once(
              'frontend/src/lib/importService.base.ts',
              '''function convertSiyuanImportToMarkdown(fileInfo: ImportFileInfo): string {
  let md = fileInfo.content || "";
  md = md.replace(/^---\\r?\\n[\\s\\S]*?\\r?\\n---[ \\t]*(?:\\r?\\n|$)/, "");
  md = replaceMarkdownLocalAssets(md, fileInfo.imageMap);
  return md.trim();
}''',
              '''function convertImportToMarkdown(fileInfo: ImportFileInfo): string {
  let md = fileInfo.content || "";
  // 思源导出的 frontmatter 属于迁移元数据；普通 Markdown 则保持原文，
  // 避免用户选择“Markdown”后仍被静默改写源文件结构。
  if (isSiyuanSource(fileInfo.source)) {
    md = md.replace(/^---\\r?\\n[\\s\\S]*?\\r?\\n---[ \\t]*(?:\\r?\\n|$)/, "");
  }
  md = replaceMarkdownLocalAssets(md, fileInfo.imageMap);
  return md.trim();
}''',
