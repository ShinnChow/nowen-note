name: v1.4.7 Delete Reconcile Patch

on:
  push:
    branches: [release/v1.4.7]
    paths:
      - '.github/workflows/v147-delete-reconcile-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply delete reconciliation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Unified knowledge-tree delete must emit the existing privacy-safe
          #    batch deletion event so other tabs/clients reconcile immediately.
          route = Path('backend/src/routes/knowledge-tree.ts')
          text = route.read_text()
          import_needle = 'import { getDb } from "../db/schema.js";\n'
          import_replacement = import_needle + 'import { broadcastNotesDeleted } from "../services/realtime.js";\n'
          if import_needle not in text:
              raise SystemExit('knowledge-tree route import needle missing')
          text = text.replace(import_needle, import_replacement, 1)

          old_delete = '''app.delete("/nodes/:nodeId", (c) => {
            try {
              const mode = c.req.query("mode") === "promote" ? "promote" : "subtree";
              return c.json(deleteKnowledgeNode({
                actorUserId: userIdOf(c),
                nodeId: c.req.param("nodeId"),
                mode,
              }));
            } catch (error) {
              return mapError(c, error);
            }
          });'''
          new_delete = '''app.delete("/nodes/:nodeId", (c) => {
            try {
              const mode = c.req.query("mode") === "promote" ? "promote" : "subtree";
              const actorUserId = userIdOf(c);
              const nodeId = c.req.param("nodeId");
              const db = getDb();
              const scope = db.prepare("SELECT workspaceId FROM knowledge_tree_nodes WHERE id = ?")
                .get(nodeId) as { workspaceId: string | null } | undefined;
              const result = deleteKnowledgeNode({
                actorUserId,
                nodeId,
                mode,
                db,
              });

              // DELETE /knowledge-tree returns tree-node ids. Resolve the affected
              // note resource ids after the soft delete (tree rows intentionally
              // remain as tombstones) and reuse the existing privacy-safe batch
              // realtime event: the actor receives exact ids, workspace peers only
              // receive a generic invalidation signal.
              if (result.affectedNodeIds.length > 0) {
                const placeholders = result.affectedNodeIds.map(() => "?").join(",");
                const affectedNotes = db.prepare(`
                  SELECT resourceId FROM knowledge_tree_nodes
                  WHERE resourceType = 'note' AND id IN (${placeholders})
                `).all(...result.affectedNodeIds) as Array<{ resourceId: string }>;
                broadcastNotesDeleted(
                  Array.from(new Set(affectedNotes.map((row) => row.resourceId).filter(Boolean))),
                  {
                    actorUserId,
                    ...(scope?.workspaceId ? { workspaceId: scope.workspaceId } : {}),
                    trashed: true,
                  },
                );
              }

              return c.json(result);
            } catch (error) {
              return mapError(c, error);
            }
          });'''
          if old_delete not in text:
              raise SystemExit('knowledge-tree delete route needle missing')
          text = text.replace(old_delete, new_delete, 1)
          route.write_text(text)

          # 2) Same-tab desktop/mobile deletion should not wait for an async
          #    refetch/realtime round-trip before removing ghost titles/tabs.
          for component_path in [
              'frontend/src/components/KnowledgeTreePanel.tsx',
              'frontend/src/components/MobileKnowledgeTreePanel.tsx',
          ]:
              component = Path(component_path)
              text = component.read_text()
              api_import = 'import { api } from "@/lib/api";\n'
              reconcile_import = 'import { affectedKnowledgeNoteIds } from "@/lib/knowledgeTreeDeleteReconcile";\n'
              if reconcile_import not in text:
                  if api_import not in text:
                      raise SystemExit(f'{component_path}: api import needle missing')
                  text = text.replace(api_import, api_import + reconcile_import, 1)

              delete_needle = '      await knowledgeTreeApi.remove(node.id, mode);\n'
              delete_replacement = '''      const deleted = await knowledgeTreeApi.remove(node.id, mode);
                const deletedNoteIds = affectedKnowledgeNoteIds(nodes, deleted.affectedNodeIds);
                for (const noteId of deletedNoteIds) {
                  actions.removeNoteFromList(noteId);
                  actions.removeNoteTab(noteId);
                }
                if (state.activeNote && deletedNoteIds.includes(state.activeNote.id)) {
                  actions.setActiveNote(null);
                }
          '''
              if delete_needle not in text:
                  raise SystemExit(f'{component_path}: delete needle missing')
              text = text.replace(delete_needle, delete_replacement, 1)
              component.write_text(text)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent

      - name: Backend recycle-bin regression
        working-directory: backend
        run: node --import tsx --test tests/recycle-bin-capability-guard.test.ts

      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      - name: Frontend delete reconciliation regression
        working-directory: frontend
        run: npx vitest run --reporter=basic src/lib/__tests__/knowledgeTreeDeleteReconcile.test.ts

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add \
            backend/src/routes/knowledge-tree.ts \
            frontend/src/components/KnowledgeTreePanel.tsx \
            frontend/src/components/MobileKnowledgeTreePanel.tsx
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "fix(sync): reconcile knowledge-tree deletions immediately"
          git push origin HEAD:release/v1.4.7
