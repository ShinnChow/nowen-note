name: Apply Edge share copy fallback fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.number == 505 && github.event.comment.body == '/apply-edge-share-copy-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edge-share-copy-fallback
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch ShareModal clipboard handling
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/ShareModal.tsx')
          source = path.read_text(encoding='utf-8')

          import_anchor = 'import { api } from "@/lib/api";\n'
          import_line = 'import { copyText } from "@/lib/clipboard";\n'
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('ShareModal api import anchor not found exactly once')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old = '''  const copy = async (value: string, id: string) => {
    try {
      await navigator.clipboard.writeText(value);
      setCopied(id);
      window.setTimeout(() => setCopied(null), 1600);
      if (publicOrigin.requiresAnonymousCheck) {
        toast.warning("链接已复制，请在无痕窗口、微信或未登录设备中验证");
      } else {
        toast.success("分享链接已复制");
      }
    } catch {
      toast.error("复制失败，请手动复制");
    }
  };
'''
          new = '''  const copy = async (value: string, id: string) => {
    const ok = await copyText(value);
    if (!ok) {
      toast.error("复制失败，请手动复制");
      return;
    }

    setCopied(id);
    window.setTimeout(() => setCopied((current) => current === id ? null : current), 1600);
    if (publicOrigin.requiresAnonymousCheck) {
      toast.warning("链接已复制，请在无痕窗口、微信或未登录设备中验证");
    } else {
      toast.success("分享链接已复制");
    }
  };
'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'const ok = await copyText(value);' not in source:
              raise SystemExit('ShareModal copy handler anchor not found')

          path.write_text(source, encoding='utf-8')

          test_path = Path('frontend/src/components/__tests__/ShareModalClipboard.test.ts')
          test_path.write_text('''import { readFileSync } from "node:fs";
import { resolve } from "node:path";
import { describe, expect, it } from "vitest";

const source = readFileSync(resolve(process.cwd(), "src/components/ShareModal.tsx"), "utf8");

describe("ShareModal clipboard fallback", () => {
  it("uses the shared clipboard helper instead of the Edge-sensitive direct API", () => {
    expect(source).toContain('import { copyText } from "@/lib/clipboard";');
    expect(source).toContain("const ok = await copyText(value);");
    expect(source).toContain('toast.error("复制失败，请手动复制")');
    expect(source).not.toContain("navigator.clipboard.writeText(value)");
  });

  it("only clears the copied indicator for the same share", () => {
    expect(source).toContain("setCopied((current) => current === id ? null : current)");
  });
});
''', encoding='utf-8')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused clipboard regression test
        working-directory: frontend
        run: npm run test:run -- src/components/__tests__/ShareModalClipboard.test.ts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ShareModal.tsx frontend/src/components/__tests__/ShareModalClipboard.test.ts
          git commit -m "fix(share): add Edge clipboard fallback"
          git push origin HEAD:fix/edge-share-copy-fallback
