name: Issue 370 Yjs flush fix

on:
  push:
    branches:
      - feat/issue-370-p0c-p1-knowledge-tree
    paths:
      - ".github/workflows/issue-370-yjs-flush-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-370-p0c-p1-knowledge-tree
          fetch-depth: 0
      - name: Avoid no-op Yjs version bumps
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/services/yjs.ts")
          text = path.read_text(encoding="utf-8")
          old = '''export function yFlush(noteId: string) {
            const room = rooms.get(noteId);
            if (!room) return;
            if (room.persistTimer) {
              clearTimeout(room.persistTimer);
              room.persistTimer = null;
            }
            try { persistToNotesTable(room); } catch {}
            try {
'''
          new = '''export function yFlush(noteId: string) {
            const room = rooms.get(noteId);
            if (!room) return;
            const hadPendingPersist = Boolean(room.persistTimer);
            if (room.persistTimer) {
              clearTimeout(room.persistTimer);
              room.persistTimer = null;
            }
            // A room created only for server-side content replacement has no pending debounce.
            // Persisting it again would increment notes.version without a user edit and break
            // optimistic operations such as immediate note-split undo.
            if (hadPendingPersist) {
              try { persistToNotesTable(room); } catch {}
            }
            try {
'''
          if old not in text:
              raise SystemExit("target yFlush snippet not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/yjs.ts
          git commit -m "fix(yjs): avoid no-op version bump during flush"
          git push origin HEAD:feat/issue-370-p0c-p1-knowledge-tree
