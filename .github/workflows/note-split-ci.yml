name: Note Split CI

on:
  push:
    branches: [main]
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/lib/noteSplit.ts"
      - "backend/src/lib/tiptapNoteSplit.ts"
      - "backend/src/lib/noteBlockRedirects.ts"
      - "backend/src/runtime/note-split.ts"
      - "backend/src/runtime/note-split-selection.ts"
      - "backend/src/runtime/note-split-tiptap.ts"
      - "backend/src/runtime/block-link-redirect.ts"
      - "backend/src/runtime/task-stats-hardening.ts"
      - "backend/tests/note-split.test.ts"
      - "backend/tests/note-split-title.test.ts"
      - "backend/tests/tiptap-note-split.test.ts"
      - "backend/tests/tiptap-note-split-empty.test.ts"
      - "backend/tests/block-link-redirect.test.ts"
      - "frontend/vite.config.ts"
      - "frontend/src/lib/noteSplit.ts"
      - "frontend/src/lib/tiptapNoteSplit.ts"
      - "frontend/src/lib/noteSplitApi.ts"
      - "frontend/src/lib/blockNavigation.ts"
      - "frontend/src/lib/__tests__/noteSplit.test.ts"
      - "frontend/src/lib/__tests__/tiptapNoteSplit.test.ts"
      - "frontend/src/lib/__tests__/blockNavigation.test.ts"
      - "frontend/src/components/NoteSplitDialog.tsx"
      - "frontend/src/components/EditorPaneRuntime.tsx"
      - "frontend/src/components/__tests__/NoteSplitDialog.test.tsx"
      - ".github/workflows/note-split-ci.yml"
  pull_request:
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/lib/noteSplit.ts"
      - "backend/src/lib/tiptapNoteSplit.ts"
      - "backend/src/lib/noteBlockRedirects.ts"
      - "backend/src/runtime/note-split.ts"
      - "backend/src/runtime/note-split-selection.ts"
      - "backend/src/runtime/note-split-tiptap.ts"
      - "backend/src/runtime/block-link-redirect.ts"
      - "backend/src/runtime/task-stats-hardening.ts"
      - "backend/tests/note-split.test.ts"
      - "backend/tests/note-split-title.test.ts"
      - "backend/tests/tiptap-note-split.test.ts"
      - "backend/tests/tiptap-note-split-empty.test.ts"
      - "backend/tests/block-link-redirect.test.ts"
      - "frontend/vite.config.ts"
      - "frontend/src/lib/noteSplit.ts"
      - "frontend/src/lib/tiptapNoteSplit.ts"
      - "frontend/src/lib/noteSplitApi.ts"
      - "frontend/src/lib/blockNavigation.ts"
      - "frontend/src/lib/__tests__/noteSplit.test.ts"
      - "frontend/src/lib/__tests__/tiptapNoteSplit.test.ts"
      - "frontend/src/lib/__tests__/blockNavigation.test.ts"
      - "frontend/src/components/NoteSplitDialog.tsx"
      - "frontend/src/components/EditorPaneRuntime.tsx"
      - "frontend/src/components/__tests__/NoteSplitDialog.test.tsx"
      - ".github/workflows/note-split-ci.yml"

permissions:
  contents: read
  issues: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Split preview, selection, and redirect tests
        run: >-
          npm run test:run --
          src/lib/__tests__/noteSplit.test.ts
          src/lib/__tests__/tiptapNoteSplit.test.ts
          src/lib/__tests__/blockNavigation.test.ts
          src/components/__tests__/NoteSplitDialog.test.tsx
      - name: Frontend typecheck
        run: npx tsc -b

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prepare diagnostic logs
        run: mkdir -p .ci
      - id: split_tests
        name: Split planner, transaction, and redirect tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          test_files=(
            tests/note-split.test.ts
            tests/note-split-title.test.ts
            tests/tiptap-note-split.test.ts
            tests/tiptap-note-split-empty.test.ts
            tests/block-link-redirect.test.ts
          )
          timeout 180s node --import tsx --import ./tests/setup-db-isolation.ts --test "${test_files[@]}" 2>&1 | tee .ci/combined.log
          combined_status=${PIPESTATUS[0]}
          echo "combined_status=${combined_status}" | tee .ci/status.txt
          if [ "${combined_status}" -ne 0 ]; then
            for test_file in "${test_files[@]}"; do
              log_name=".ci/$(basename "${test_file}" .ts).log"
              echo "===== ${test_file} =====" | tee -a .ci/status.txt
              timeout 90s node --import tsx --import ./tests/setup-db-isolation.ts --test "${test_file}" 2>&1 | tee "${log_name}"
              file_status=${PIPESTATUS[0]}
              echo "${test_file}=${file_status}" | tee -a .ci/status.txt
            done
          fi
          exit "${combined_status}"
      - name: Publish backend diagnostics
        if: steps.split_tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- note-split-backend-diagnostics -->';
            const read = (path) => {
              try { return fs.readFileSync(path, 'utf8'); } catch { return '(missing)'; }
            };
            const status = read('backend/.ci/status.txt');
            const combined = read('backend/.ci/combined.log').slice(-9000);
            const body = `${marker}\n## Note Split Backend 诊断\n\nCommit：\`${context.sha}\`\n\n\`\`\`text\n${status}\n\n--- combined tail ---\n${combined}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Backend typecheck
        if: steps.split_tests.outcome == 'success'
        run: npm run build:tsc
      - name: Enforce backend result
        if: steps.split_tests.outcome == 'failure'
        run: exit 1
