name: Note Split CI

on:
  push:
    branches: [main]
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/lib/noteSplit.ts"
      - "backend/src/lib/tiptapNoteSplit.ts"
      - "backend/src/lib/noteBlockRedirects.ts"
      - "backend/src/runtime/note-split.ts"
      - "backend/src/runtime/note-split-selection.ts"
      - "backend/src/runtime/note-split-tiptap.ts"
      - "backend/src/runtime/block-link-redirect.ts"
      - "backend/src/runtime/task-stats-hardening.ts"
      - "backend/tests/note-split.test.ts"
      - "backend/tests/note-split-title.test.ts"
      - "backend/tests/tiptap-note-split.test.ts"
      - "backend/tests/tiptap-note-split-empty.test.ts"
      - "backend/tests/block-link-redirect.test.ts"
      - "backend/tests/setup-db-cleanup.ts"
      - "frontend/vite.config.ts"
      - "frontend/src/lib/noteSplit.ts"
      - "frontend/src/lib/tiptapNoteSplit.ts"
      - "frontend/src/lib/noteSplitApi.ts"
      - "frontend/src/lib/blockNavigation.ts"
      - "frontend/src/lib/__tests__/noteSplit.test.ts"
      - "frontend/src/lib/__tests__/tiptapNoteSplit.test.ts"
      - "frontend/src/lib/__tests__/blockNavigation.test.ts"
      - "frontend/src/components/NoteSplitDialog.tsx"
      - "frontend/src/components/EditorPaneRuntime.tsx"
      - "frontend/src/components/__tests__/NoteSplitDialog.test.tsx"
      - ".github/workflows/note-split-ci.yml"
  pull_request:
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/lib/noteSplit.ts"
      - "backend/src/lib/tiptapNoteSplit.ts"
      - "backend/src/lib/noteBlockRedirects.ts"
      - "backend/src/runtime/note-split.ts"
      - "backend/src/runtime/note-split-selection.ts"
      - "backend/src/runtime/note-split-tiptap.ts"
      - "backend/src/runtime/block-link-redirect.ts"
      - "backend/src/runtime/task-stats-hardening.ts"
      - "backend/tests/note-split.test.ts"
      - "backend/tests/note-split-title.test.ts"
      - "backend/tests/tiptap-note-split.test.ts"
      - "backend/tests/tiptap-note-split-empty.test.ts"
      - "backend/tests/block-link-redirect.test.ts"
      - "backend/tests/setup-db-cleanup.ts"
      - "frontend/vite.config.ts"
      - "frontend/src/lib/noteSplit.ts"
      - "frontend/src/lib/tiptapNoteSplit.ts"
      - "frontend/src/lib/noteSplitApi.ts"
      - "frontend/src/lib/blockNavigation.ts"
      - "frontend/src/lib/__tests__/noteSplit.test.ts"
      - "frontend/src/lib/__tests__/tiptapNoteSplit.test.ts"
      - "frontend/src/lib/__tests__/blockNavigation.test.ts"
      - "frontend/src/components/NoteSplitDialog.tsx"
      - "frontend/src/components/EditorPaneRuntime.tsx"
      - "frontend/src/components/__tests__/NoteSplitDialog.test.tsx"
      - ".github/workflows/note-split-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Split preview, selection, and redirect tests
        run: >-
          npm run test:run --
          src/lib/__tests__/noteSplit.test.ts
          src/lib/__tests__/tiptapNoteSplit.test.ts
          src/lib/__tests__/blockNavigation.test.ts
          src/components/__tests__/NoteSplitDialog.test.tsx
      - name: Frontend typecheck
        run: npx tsc -b

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      combined_status: ${{ steps.split_tests.outputs.combined_status }}
      note_split_status: ${{ steps.split_tests.outputs.note_split_status }}
      note_split_title_status: ${{ steps.split_tests.outputs.note_split_title_status }}
      tiptap_note_split_status: ${{ steps.split_tests.outputs.tiptap_note_split_status }}
      tiptap_note_split_empty_status: ${{ steps.split_tests.outputs.tiptap_note_split_empty_status }}
      block_link_redirect_status: ${{ steps.split_tests.outputs.block_link_redirect_status }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prepare diagnostic logs
        run: mkdir -p .ci
      - id: split_tests
        name: Split planner, transaction, and redirect tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          test_files=(
            tests/note-split.test.ts
            tests/note-split-title.test.ts
            tests/tiptap-note-split.test.ts
            tests/tiptap-note-split-empty.test.ts
            tests/block-link-redirect.test.ts
          )
          timeout 120s node --import tsx --import ./tests/setup-db-isolation.ts --import ./tests/setup-db-cleanup.ts --test "${test_files[@]}" > .ci/combined.log 2>&1
          combined_status=$?
          echo "combined_status=${combined_status}" >> "$GITHUB_OUTPUT"

          keys=(
            note_split_status
            note_split_title_status
            tiptap_note_split_status
            tiptap_note_split_empty_status
            block_link_redirect_status
          )
          if [ "${combined_status}" -ne 0 ]; then
            pids=()
            for index in "${!test_files[@]}"; do
              test_file="${test_files[$index]}"
              key="${keys[$index]}"
              (
                timeout 60s node --import tsx --import ./tests/setup-db-isolation.ts --import ./tests/setup-db-cleanup.ts --test "${test_file}" > ".ci/${key}.log" 2>&1
                echo "$?" > ".ci/${key}.status"
              ) &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do wait "${pid}"; done
            for key in "${keys[@]}"; do
              value=$(cat ".ci/${key}.status" 2>/dev/null || echo missing)
              echo "${key}=${value}" >> "$GITHUB_OUTPUT"
              if [ "${value}" != "0" ]; then
                echo "===== ${key} tail ====="
                tail -n 160 ".ci/${key}.log" 2>/dev/null || true
              fi
            done
          else
            for key in "${keys[@]}"; do echo "${key}=not_run" >> "$GITHUB_OUTPUT"; done
          fi
          exit "${combined_status}"
      - name: Backend typecheck
        if: steps.split_tests.outcome == 'success'
        run: npm run build:tsc
      - name: Enforce backend result
        if: steps.split_tests.outcome == 'failure'
        run: exit 1

  diagnostics:
    if: always() && needs.backend.outputs.combined_status != '0'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Print backend diagnostic status
        run: |
          echo "combined_status=${{ needs.backend.outputs.combined_status }}"
          echo "note_split_status=${{ needs.backend.outputs.note_split_status }}"
          echo "note_split_title_status=${{ needs.backend.outputs.note_split_title_status }}"
          echo "tiptap_note_split_status=${{ needs.backend.outputs.tiptap_note_split_status }}"
          echo "tiptap_note_split_empty_status=${{ needs.backend.outputs.tiptap_note_split_empty_status }}"
          echo "block_link_redirect_status=${{ needs.backend.outputs.block_link_redirect_status }}"
