name: Guarded PostgreSQL Yjs write migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: guarded-pg-yjs-write
  cancel-in-progress: false

jobs:
  migrate:
    if: github.head_ref == 'pg-yjs-write-trigger-v2-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-yjs-write-20260730
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply realtime and regression slice
        id: patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/scripts/apply-pg-yjs-write-slice.py")
          text = path.read_text()
          text = text.replace(
            "const joined = await yjs.join(noteId, connectionId);",
            "const result = await yjs.join(noteId, connectionId);",
          )
          text = text.replace(
            "          readOnly: true,\n          source: joined.source,",
            "          warnings: result.warnings,\n          readOnly: true,",
          )
          text = text.replace(
            "          readOnly: !writable,\n          source: joined.source,",
            "          warnings: result.warnings,\n          readOnly: !writable,",
          )
          text = text.replace(
            '''        "yjs-read-sync",
        "yjs-awareness-relay",
      ],
      pendingCapabilities: ["yjs-update-write", "yjs-snapshot-compaction"],''',
            '''            "yjs-read-sync",
            "yjs-awareness-relay",
          ],
          pendingCapabilities: ["yjs-update-write", "yjs-snapshot-compaction"],''',
          )
          text = text.replace(
            '''        "yjs-read-sync",
        "yjs-awareness-relay",
        "yjs-update-write",
      ],
      pendingCapabilities: ["yjs-snapshot-compaction"],''',
            '''            "yjs-read-sync",
            "yjs-awareness-relay",
            "yjs-update-write",
          ],
          pendingCapabilities: ["yjs-snapshot-compaction"],''',
          )
          path.write_text(text)
          PY
          python backend/scripts/apply-pg-yjs-write-slice.py
          rm -f backend/scripts/apply-pg-yjs-write-slice.py .github/pg-yjs-pr-trigger
          git add -A
          git commit -m "feat(pg): enable transactional Yjs update writes"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund || (sleep 5 && npm ci --no-audit --no-fund)
      - name: TypeScript
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Direct DB audit
        working-directory: backend
        run: npm run audit:sqlite-boundaries
      - name: PostgreSQL schema parity
        working-directory: backend
        run: npm run audit:pg-schema-parity
      - name: PostgreSQL Yjs write tests
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-yjs-read-runtime-pg.test.ts
          tests/postgres-realtime-yjs-pg.test.ts
      - name: Full SQLite regression
        working-directory: backend
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ""
          TEST_PG_DATABASE_URL: ""
        run: npm run test:serial
      - name: Production backend bundle
        working-directory: backend
        run: npm run build
      - name: Push validated Yjs branch
        run: git push origin HEAD:pg-yjs-write-20260730
