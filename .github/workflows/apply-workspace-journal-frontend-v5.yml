name: Apply Workspace Journal Frontend V5

on:
  pull_request:
    branches:
      - feature/journal-cleanup-natural-dates-v4
  push:
    branches:
      - feature/workspace-shared-journals-v5
    paths:
      - scripts/apply-workspace-journal-frontend-v5.py
      - .github/workflows/apply-workspace-journal-frontend-v5.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-shared-journals-v5
          fetch-depth: 0
      - name: Apply deterministic frontend integration
        run: python3 scripts/apply-workspace-journal-frontend-v5.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Workspace journal frontend regressions
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/journalScope.test.ts
          src/lib/__tests__/dailyRecordCommandDefinitions.test.ts
          src/components/daily-records/__tests__/dailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/markdownDailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/workspaceSharedJournalContract.test.ts
          src/components/daily-records/__tests__/journalArchiveCleanupContract.test.ts
          src/components/__tests__/SlashCommandExtension.test.ts
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Vite production bundle
        working-directory: frontend
        run: npx vite build
      - name: Commit integrated frontend files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/api.impl.ts frontend/src/components/daily-records/DailyJournalView.tsx
          if git diff --cached --quiet; then
            echo "No frontend integration changes to commit"
            exit 0
          fi
          git commit -m "feat(journals): add workspace journal scope UI"
          git push origin HEAD:feature/workspace-shared-journals-v5
