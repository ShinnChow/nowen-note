name: Finalize v1.4.10 release metadata

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/finalize-v1410-release-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize Android version and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path('frontend/android/app/build.gradle')
          text = gradle.read_text()
          if 'versionCode 10409' not in text or 'versionName "1.4.9"' not in text:
              raise SystemExit('unexpected Android version metadata')
          text = text.replace('versionCode 10409', 'versionCode 10410', 1)
          text = text.replace('versionName "1.4.9"', 'versionName "1.4.10"', 1)
          gradle.write_text(text)

          changelog = Path('CHANGELOG.md')
          raw = changelog.read_text()
          marker = '<!-- ADD_NEW_HERE -->'
          if marker not in raw:
              raise SystemExit('missing changelog marker')
          section = '''## v1.4.10 - 2026-08-12

### ✨ 新增

- **笔记模板**: 支持保存模板、从模板创建笔记，并补齐移动端入口与模板附件保护
- **编辑器**: 增强图片查看、编辑、旋转与附件打开体验
- **Electron**: 新增原生文本右键菜单与本地办公附件系统默认程序打开

### 🐛 修复

- **笔记图片**: 加固附件身份与内容持久化，避免保存后重新打开出现图片占位符
- **导入导出**: 修复 Nowen Markdown 附件 ZIP 往返导入，并完善思源导入反馈与文件识别
- **备份**: 修复自动/手动备份的 db-only 保留策略及停用配置持久化
- **任务提醒**: 统一全天截止、创建端时区与原生通知调度，并收紧提醒接口权限
- **移动端**: 修复 Android 返回键浮层消费顺序并优化媒体入口
- **编辑器**: 修复图片目标位置可空导致的 TypeScript 发版阻断

### ⚡ 优化

- **下载页**: 增强 GitHub Release 页面回退，并按平台与安装类型稳定分组
- **离线同步**: 调整为首次默认关闭，仅在用户主动开启后运行
'''
          if '## v1.4.10 ' in raw:
              raise SystemExit('v1.4.10 changelog already exists')
          changelog.write_text(raw.replace(marker, marker + '\n\n' + section.rstrip(), 1))
          PY

          node scripts/generate-changelog.mjs --emit-json --json-limit 10
          rm .github/workflows/finalize-v1410-release-metadata.yml
          git config user.name 'Drug'
          git config user.email 'cropflre2333@gmail.com'
          git add frontend/android/app/build.gradle CHANGELOG.md frontend/public/changelog.json .github/workflows/finalize-v1410-release-metadata.yml
          git commit -m 'chore(release): finalize v1.4.10 metadata'
          git pull --rebase origin release/v1.4.10
          git push origin HEAD:release/v1.4.10
