name: Finalize v1.4.10 release metadata

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/finalize-v1410-release-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize Android version and changelog
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('frontend/android/app/build.gradle'); s=p.read_text(); assert 'versionCode 10409' in s and 'versionName \"1.4.9\"' in s; p.write_text(s.replace('versionCode 10409','versionCode 10410',1).replace('versionName \"1.4.9\"','versionName \"1.4.10\"',1))"
          python -c "from pathlib import Path; import base64; p=Path('CHANGELOG.md'); s=p.read_text(); marker='<!-- ADD_NEW_HERE -->'; assert marker in s and '## v1.4.10 ' not in s; section=base64.b64decode('').decode(); p.write_text(s.replace(marker, marker+'\n\n'+section.rstrip(),1))"
          node scripts/generate-changelog.mjs --emit-json --json-limit 10
          rm .github/workflows/finalize-v1410-release-metadata.yml
          git config user.name 'Drug'
          git config user.email 'cropflre2333@gmail.com'
          git add frontend/android/app/build.gradle CHANGELOG.md frontend/public/changelog.json .github/workflows/finalize-v1410-release-metadata.yml
          git commit -m 'chore(release): finalize v1.4.10 metadata'
          git pull --rebase origin release/v1.4.10
          git push origin HEAD:release/v1.4.10
