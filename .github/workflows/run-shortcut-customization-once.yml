name: Run Shortcut Customization Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-shortcut-customization-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shortcut-customization
          fetch-depth: 0
      - name: Apply feature-branch patch
        run: python3 scripts/applyShortcutCustomization.py
      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(shortcuts): integrate customization runtime and settings"
          git push origin HEAD:agent/shortcut-customization
      - name: Remove one-shot workflow from main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/run-shortcut-customization-once.yml
          git add .github/workflows/run-shortcut-customization-once.yml
          git commit -m "chore(shortcuts): remove one-shot customization workflow [skip ci]"
          git push origin HEAD:main
