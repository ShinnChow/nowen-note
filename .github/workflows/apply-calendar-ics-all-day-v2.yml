name: Apply Calendar ICS and All-Day V2

on:
  push:
    branches:
      - fix/calendar-ics-all-day-v2
    paths:
      - scripts/apply-calendar-ics-all-day-v2.py
      - .github/workflows/apply-calendar-ics-all-day-v2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/calendar-ics-all-day-v2
          fetch-depth: 0

      - name: Apply deterministic integration
        run: python3 scripts/apply-calendar-ics-all-day-v2.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Calendar ICS regression
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/task-calendar.test.ts

      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Task all-day regressions
        working-directory: frontend
        run: npx vitest run src/components/tasks/__tests__/taskDueTimeUtils.test.ts src/components/tasks/__tests__/taskAllDayContract.test.ts

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/routes/task-calendar.ts \
            backend/tests/task-calendar.test.ts \
            frontend/src/components/tasks/taskDateUtils.ts \
            frontend/src/components/tasks/TaskDetailPanel.tsx \
            frontend/src/components/tasks/__tests__/taskDueTimeUtils.test.ts \
            frontend/src/components/tasks/__tests__/taskAllDayContract.test.ts \
            frontend/src/i18n/locales/en.json \
            frontend/src/i18n/locales/zh-CN.json
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix(calendar): preserve ICS time semantics and add safe all-day tasks"
          git push origin HEAD:fix/calendar-ics-all-day-v2
