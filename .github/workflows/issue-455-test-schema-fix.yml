name: Issue 455 Test Schema Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_issue_455_test_schema.py'
      - '.github/workflows/issue-455-test-schema-fix.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python3 scripts/fix_issue_455_test_schema.py
      - run: rm scripts/fix_issue_455_test_schema.py
      - name: Commit corrected format painter tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/__tests__/formatPainter.test.ts scripts/fix_issue_455_test_schema.py
          git commit -m "test(editor): align format painter fixtures with schema"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
