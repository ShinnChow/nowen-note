name: Issue 455 Nested Block Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_issue_455_nested_block_safety.py'
      - '.github/workflows/issue-455-nested-block-safety.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python3 scripts/fix_issue_455_nested_block_safety.py
      - run: rm scripts/fix_issue_455_nested_block_safety.py
      - name: Commit nested block safety fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/formatPainter.ts \
                  frontend/src/lib/__tests__/formatPainter.test.ts \
                  scripts/fix_issue_455_nested_block_safety.py
          git commit -m "fix(editor): preserve nested block structure in format painter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
