name: Apply issue 512 root document creation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-issue-512.yml

permissions:
  contents: write

concurrency:
  group: apply-issue-512
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          # Frontend: make all + buttons choose among rich text, Markdown and folder.
          replace_once(
              "frontend/src/components/KnowledgeTreeNodeMenu.tsx",
              '{ id: "new_note", label: "文档", icon: <FilePlus size={14} /> },',
              '{ id: "new_note", label: "富文本文档", icon: <FilePlus size={14} /> },',
          )

          panel = "frontend/src/components/KnowledgeTreePanel.tsx"
          replace_once(
