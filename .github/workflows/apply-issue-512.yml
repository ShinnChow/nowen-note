function ensureRootDocumentNotebook(
  db: Database.Database,
  userId: string,
  workspaceId: string | null,
): string {
  const id = workspaceId
    ? `${ROOT_DOCUMENT_NOTEBOOK_PREFIX}workspace:${workspaceId}`
    : `${ROOT_DOCUMENT_NOTEBOOK_PREFIX}personal:${userId}`;
  const workspaceOwner = workspaceId
    ? db.prepare("SELECT ownerId FROM workspaces WHERE id = ?").get(workspaceId) as { ownerId: string } | undefined
    : undefined;
  const ownerUserId = workspaceOwner?.ownerId || userId;

  db.prepare(`
    INSERT OR IGNORE INTO notebooks (
      id, userId, workspaceId, parentId, name, icon, sortOrder, isExpanded, isDeleted
    ) VALUES (?, ?, ?, NULL, '__NOWEN_ROOT_DOCUMENTS__', '📄', -2147483648, 0, 0)
  `).run(id, ownerUserId, workspaceId);
  db.prepare(`
    UPDATE notebooks
    SET userId = ?, workspaceId = ?, parentId = NULL, isDeleted = 0,
        deletedAt = NULL, updatedAt = datetime('now')
    WHERE id = ?
  `).run(ownerUserId, workspaceId, id);
  return id;
}

function recordHistory''',
