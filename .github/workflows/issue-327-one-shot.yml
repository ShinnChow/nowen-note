name: Issue 327 one-shot integration

on:
  push:
    branches:
      - fix/issue-327-code-block-indent
    paths:
      - .github/workflows/issue-327-one-shot.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/issue-327-one-shot.yml
      - frontend/src/lib/codeBlockIndent.ts
      - frontend/src/lib/__tests__/codeBlockIndent.test.ts

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-327-code-block-indent
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Integrate stable indent extension
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/TiptapEditor.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import CodeBlockView from "@/components/CodeBlockView";\n'
          import_line = 'import { IndentExtension } from "@/lib/codeBlockIndent";\n'
          if import_line not in text:
              assert text.count(import_anchor) == 1, "CodeBlockView import anchor changed"
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "// 自定义缩进扩展\n"
          end_marker = "/**\n * BLOCK-ID-01: 块 ID 扩展"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]

          def insert_code_block_guard(source: str, delta: int) -> str:
              command = f'(editor.chain().focus() as any).changeIndent({delta}).run();'
              command_pos = source.index(command)
              handler_start = source.rfind('          onClick={() => {\n', 0, command_pos)
              assert handler_start >= 0, f"toolbar handler for {delta} not found"
              body_start = handler_start + len('          onClick={() => {\n')
              existing = source[body_start:command_pos]
              guard = (
                  '            // Code blocks own their indentation even when nested in a list item.\n'
                  '            // Route them through changeIndent before list commands can move the surrounding item.\n'
                  '            if (editor.isActive("codeBlock")) {\n'
                  f'              (editor.chain().focus() as any).changeIndent({delta}).run();\n'
                  '              return;\n'
                  '            }\n'
              )
              if 'if (editor.isActive("codeBlock"))' not in existing:
                  source = source[:body_start] + guard + source[body_start:]
              return source

          text = insert_code_block_guard(text, 1)
          text = insert_code_block_guard(text, -1)

          assert import_line in text
          assert start_marker not in text
          assert text.count('if (editor.isActive("codeBlock"))') >= 2
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run issue 327 regression tests
        run: npm --prefix frontend run test:run -- src/lib/__tests__/codeBlockIndent.test.ts src/components/__tests__/CodeBlockView.indent.test.tsx

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit verified integration
        shell: bash
        run: |
          rm .github/workflows/issue-327-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): stabilize code block indentation and numbering (#327)"
          git push origin HEAD:fix/issue-327-code-block-indent
