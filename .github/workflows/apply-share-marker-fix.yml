name: Apply share marker fix

on:
  push:
    branches:
      - fix/share-hide-internal-block-markers
    paths:
      - .github/workflows/apply-share-marker-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-hide-internal-block-markers
          fetch-depth: 0

      - name: Apply source and regression test changes
        run: |
          python - <<'PY'
          from pathlib import Path

          component_path = Path("frontend/src/components/SharedNoteView.tsx")
          component = component_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          component = replace_once(
              component,
              'import { renderKatex } from "@/lib/katexRenderer";\n',
              'import { renderKatex } from "@/lib/katexRenderer";\nimport { projectMarkdownForUser } from "@/lib/markdownUserContent";\n',
              "markdown projection import",
          )

          normalize_fn = '''export function normalizeExternalHref(href: string): string {
            const trimmed = href.trim();
            if (/^\\/\\//.test(trimmed)) {
              const protocol = typeof window !== "undefined" ? window.location.protocol : "https:";
              return `${protocol}${trimmed}`;
            }
            return trimmed;
          }
          '''
          normalize_with_helper = normalize_fn + '''
          /** Remove Nowen's persisted Markdown block identity markers from public presentation only. */
          export function prepareSharedMarkdownForDisplay(markdown: string): string {
            return projectMarkdownForUser(markdown);
          }
          '''
          component = replace_once(
              component,
              normalize_fn,
              normalize_with_helper,
              "shared markdown display helper",
          )

          readonly_line = '  const isReadOnlyContent = !(isEditing && (content?.permission === "edit" || content?.permission === "edit_auth"));\n'
          readonly_with_projection = readonly_line + '''  const sharedMarkdownForDisplay = useMemo(
            () => content && detectFormat(content.content) === "md"
              ? prepareSharedMarkdownForDisplay(content.content)
              : "",
            [content?.content],
          );
          '''
          component = replace_once(
              component,
              readonly_line,
              readonly_with_projection,
              "shared markdown memo",
          )

          raw_render = '''                {preprocessMarkdownMath(
                            preprocessMarkdownFootnotes(
                              content.content,
                              computeFootnoteOrderFromMarkdown(content.content)
                            )
                          )}
          '''
          clean_render = '''                {preprocessMarkdownMath(
                            preprocessMarkdownFootnotes(
                              sharedMarkdownForDisplay,
                              computeFootnoteOrderFromMarkdown(sharedMarkdownForDisplay)
                            )
                          )}
          '''
          component = replace_once(
              component,
              raw_render,
              clean_render,
              "ReactMarkdown public content projection",
          )
          component_path.write_text(component, encoding="utf-8")

          test_path = Path("frontend/src/components/__tests__/SharedNoteViewLinks.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = replace_once(
              test_text,
              'import { isExternalHttpLink, normalizeExternalHref } from "../SharedNoteView";\n',
              'import { isExternalHttpLink, normalizeExternalHref, prepareSharedMarkdownForDisplay } from "../SharedNoteView";\n',
              "test helper import",
          )
          insertion = '''
            it("removes internal block markers from shared Markdown without touching fenced code", () => {
              const headingId = "blk_d4036fa3-d1bc-4122-8cb7-e38c70121fd2";
              const paragraphId = "blk_9d522ad3-f979-4f5c-8199-04cf015a2f2b";
              const standaloneId = "blk_9410a1d5-c5a6-4500-bd74-fff701f61dd5";
              const codeId = "blk_70cdc697-85b2-4797-8b4e-c5bfefc594f4";
              const internal = [
                `# 前端研发组团队周报 ^${headingId}`,
                "",
                `生成时间：2026-07-28 ^${paragraphId}`,
                "",
                `^${standaloneId}`,
                "",
                "```text",
                `^${codeId}`,
                "```",
              ].join("\\n");

              const projected = prepareSharedMarkdownForDisplay(internal);

              expect(projected).toContain("# 前端研发组团队周报");
              expect(projected).toContain("生成时间：2026-07-28");
              expect(projected).not.toContain(headingId);
              expect(projected).not.toContain(paragraphId);
              expect(projected).not.toContain(standaloneId);
              expect(projected).toContain(`^${codeId}`);
            });
          '''
          closing = "});\n"
          if not test_text.endswith(closing):
              raise SystemExit("test suite closing marker not found")
          test_text = test_text[:-len(closing)] + insertion + closing
          test_path.write_text(test_text, encoding="utf-8")
          PY

          rm .github/workflows/apply-share-marker-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/SharedNoteView.tsx frontend/src/components/__tests__/SharedNoteViewLinks.test.ts .github/workflows/apply-share-marker-fix.yml
          git commit -m "fix(share): hide internal markdown block markers"
          git push origin HEAD:fix/share-hide-internal-block-markers
