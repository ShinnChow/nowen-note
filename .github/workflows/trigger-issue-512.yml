name: Trigger issue 512 implementation

on:
  push:
    branches: [main]
    paths:
      - .github/issue-512-trigger

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trigger implementation workflow
        run: |
          printf '\n# triggered from marker %s\n' "${GITHUB_SHA}" >> .github/workflows/apply-issue-512.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-issue-512.yml
          git commit -m "chore(ci): trigger issue 512 implementation"
          git push origin HEAD:main
