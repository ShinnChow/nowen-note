name: Android Immersive Editor Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_android_immersive_editor.py'
      - '.github/workflows/android-immersive-editor-cutover.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Prepare unique EditorPane anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pane = Path('frontend/src/components/EditorPane.tsx')
          source = pane.read_text(encoding='utf-8')
          old = '''  const handleEditorReady = useCallback((scrollTo: (pos: number) => void) => {
              scrollToRef.current = scrollTo;
            }, []);
            const { t } = useTranslation();'''
          if old not in source:
              old = '''  const handleEditorReady = useCallback((scrollTo: (pos: number) => void) => {
              scrollToRef.current = scrollTo;
            }, []);
            const { t } = useTranslation();'''.replace('            ', '  ')
          if source.count(old) != 1:
              raise SystemExit(f'EditorPane primary translation anchor count={source.count(old)}')
          new = old + '\n  const { visible: keyboardVisible } = useKeyboardVisible();'
          pane.write_text(source.replace(old, new, 1), encoding='utf-8')

          patch = Path('scripts/patch_android_immersive_editor.py')
          text = patch.read_text(encoding='utf-8')
          block = '''replace_once(
              "frontend/src/components/EditorPane.tsx",
              "  const { t } = useTranslation();",
              "  const { t } = useTranslation();\\n  const { visible: keyboardVisible } = useKeyboardVisible();",
          )
          '''
          if text.count(block) != 1:
              raise SystemExit(f'ambiguous patch block count={text.count(block)}')
          patch.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
      - name: Apply Android immersive editor patch
        id: patch
        continue-on-error: true
        run: python3 scripts/patch_android_immersive_editor.py > patch-output.log 2>&1
      - name: Upload patch diagnostics
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-immersive-patch-diagnostics
          path: patch-output.log
          if-no-files-found: error
      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Remove one-shot patch script
        run: rm scripts/patch_android_immersive_editor.py
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/EditorPane.tsx \
                  frontend/src/components/TiptapEditor.tsx \
                  frontend/src/components/PublicSpaceLauncher.tsx \
                  frontend/src/lib/__tests__/androidImmersiveEditorContract.test.ts \
                  scripts/patch_android_immersive_editor.py
          git commit -m "feat(android): add immersive mobile editing mode"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
