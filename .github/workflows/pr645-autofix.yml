      if (canViewSearchCandidate(db, row.id, userId)) ids.add(row.id);
      if (ids.size >= MAX_TERM_CANDIDATES) break;
    }
    if (rows.length < TERM_CANDIDATE_PAGE_SIZE) break;
    offset += rows.length;
  }
  return ids;
}

