name: Apply long note title wrapping fix

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/patch-wrap-long-note-title-v1410.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10

      - name: Patch long note title wrapping
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          tiptap = "frontend/src/components/TiptapEditor.tsx"
          replace_once(
              tiptap,
              'const titleRef = useRef<HTMLInputElement>(null);',
              'const titleRef = useRef<HTMLTextAreaElement>(null);',
          )
          replace_once(
              tiptap,
              '''  }, [note.title]);\n\n  // 组件卸载时清理 debounce timer''',
              '''  }, [note.title]);\n\n  // 标题改为多行 textarea 后，根据实际内容高度自动撑开；同时覆盖标题相同但切换笔记的场景。\n  useEffect(() => {\n    const el = titleRef.current;\n    if (!el) return;\n    el.style.height = "auto";\n    el.style.height = `${el.scrollHeight}px`;\n  }, [note.id, note.title]);\n\n  // 组件卸载时清理 debounce timer''',
          )
          replace_once(
              tiptap,
              '''        <input\n          ref={titleRef}\n          defaultValue={note.title}''',
              '''        <textarea\n          ref={titleRef}\n          rows={1}\n          defaultValue={note.title}''',
          )
          replace_once(
              tiptap,
              '''          onCompositionEnd={handleTitleCompositionEnd}\n          placeholder={t('tiptap.titlePlaceholder')}''',
              '''          onCompositionEnd={handleTitleCompositionEnd}\n          onInput={(event) => {\n            const el = event.currentTarget;\n            el.style.height = "auto";\n            el.style.height = `${el.scrollHeight}px`;\n          }}\n          onKeyDown={(event) => {\n            if (event.key === "Enter" && !isTitleComposingRef.current) event.preventDefault();\n          }}\n          placeholder={t('tiptap.titlePlaceholder')}''',
          )
          replace_once(
              tiptap,
              '"w-full bg-transparent text-xl md:text-2xl font-bold text-tx-primary placeholder:text-tx-tertiary focus:outline-none no-focus-ring"',
              '"w-full resize-none overflow-hidden break-words bg-transparent text-xl md:text-2xl font-bold text-tx-primary placeholder:text-tx-tertiary focus:outline-none no-focus-ring"',
          )

          markdown = "frontend/src/components/MarkdownEditorImpl.tsx"
          replace_once(
              markdown,
              'const titleRef = useRef<HTMLInputElement | null>(null);',
              'const titleRef = useRef<HTMLTextAreaElement | null>(null);',
          )
          replace_once(
              markdown,
              '(e: React.KeyboardEvent<HTMLInputElement>) => {',
              '(e: React.KeyboardEvent<HTMLTextAreaElement>) => {',
          )
          replace_once(
              markdown,
              '''  }, [note.title]);\n\n  // ---------- editable''',
              '''  }, [note.title]);\n\n  // 标题改为多行 textarea 后，根据实际内容高度自动撑开；同时覆盖标题相同但切换笔记的场景。\n  useEffect(() => {\n    const el = titleRef.current;\n    if (!el) return;\n    el.style.height = "auto";\n    el.style.height = `${el.scrollHeight}px`;\n  }, [note.id, note.title]);\n\n  // ---------- editable''',
          )
          replace_once(
              markdown,
              '''        <input\n          ref={titleRef}\n          defaultValue={note.title}''',
              '''        <textarea\n          ref={titleRef}\n          rows={1}\n          defaultValue={note.title}''',
          )
          replace_once(
              markdown,
              '''          onCompositionEnd={handleTitleCompositionEnd}\n          onKeyDown={handleTitleKeyDown}''',
              '''          onCompositionEnd={handleTitleCompositionEnd}\n          onInput={(event) => {\n            const el = event.currentTarget;\n            el.style.height = "auto";\n            el.style.height = `${el.scrollHeight}px`;\n          }}\n          onKeyDown={handleTitleKeyDown}''',
          )
          replace_once(
              markdown,
              '"w-full bg-transparent outline-none text-xl md:text-3xl font-bold text-tx-primary placeholder:text-tx-tertiary/60"',
              '"w-full resize-none overflow-hidden break-words bg-transparent outline-none text-xl md:text-3xl font-bold text-tx-primary placeholder:text-tx-tertiary/60"',
          )
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-wrap-long-note-title-v1410.yml
          git add frontend/src/components/TiptapEditor.tsx frontend/src/components/MarkdownEditorImpl.tsx
          git diff --cached --check
          git commit -m "fix: wrap long note titles"
          git push origin HEAD:release/v1.4.10
