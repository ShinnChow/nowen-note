# 三平台构建工作流。
#
# 发布职责约束：
#   - push tag v*.*.* 只触发 Windows/macOS/Linux 构建并上传 workflow artifacts；
#   - GitHub Release 由本地 scripts/release.sh 唯一负责创建 Draft、上传资产、校验并转正式；
#   - 本工作流禁止 electron-builder 直接发布 Release，避免与本地发布脚本并发写同一 Release。
#   - workflow_dispatch 会在 Windows job 执行 SignPath test-signing，仅用于验证签名链路；
#     测试证书产物单独上传，不替换正式 Release 产物。

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      signpath_test:
        description: "使用 SignPath test-signing 验证 Windows 代码签名"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
          - os: macos-latest
            name: mac
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ---------------------------------------------------------------
      # 依赖安装
      # 关键点：
      #   1. 不使用 --ignore-scripts。better-sqlite3 / sharp 等原生模块需要 postinstall；
      #   2. Capacitor 8 要求 Node.js >= 22，因此 CI 统一使用 Node 22；
      #   3. backend 的 better-sqlite3 后续仍需 rebuild 成 Electron ABI。
      # ---------------------------------------------------------------
      - name: Install root deps
        run: npm ci
        shell: bash

      - name: Install backend deps
        working-directory: backend
        run: npm ci
        shell: bash

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Fetch embedded Node binary
        run: npm run fetch:node
        shell: bash

      - name: Build backend & frontend
        run: npm run build:all
        shell: bash

      # ---------------------------------------------------------------
      # 把 backend/node_modules/better-sqlite3 重编为当前 Electron ABI。
      # macOS 会按 x64 / arm64 分别重建，因此这里跳过 macOS。
      # ---------------------------------------------------------------
      - name: Rebuild native modules for Electron ABI
        if: matrix.os != 'macos-latest'
        run: npm run rebuild:native
        shell: bash

      # ========= Windows 旧证书环境变量（可选，兼容现有构建） =========
      - name: Export Windows signing env
        if: matrix.os == 'windows-latest' && env.WIN_CSC_LINK != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          echo "CSC_LINK=$WIN_CSC_LINK" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> $GITHUB_ENV
        shell: bash

      # ========= macOS 代码签名 + 公证环境变量（可选） =========
      - name: Export macOS signing env
        if: matrix.os == 'macos-latest'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> $GITHUB_ENV
          fi
          if [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> $GITHUB_ENV
          fi
          echo "APPLE_ID=$APPLE_ID" >> $GITHUB_ENV
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> $GITHUB_ENV
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> $GITHUB_ENV
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> $GITHUB_ENV
        shell: bash

      # ========= 打包 =========
      # 这里显式使用 --publish never：即使由 tag push 触发，也绝不创建/修改 GitHub Release。
      # Release 的唯一发布者是 scripts/release.sh。
      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --config electron/builder.config.js --win --publish never
        shell: bash

      # ========= SignPath Windows 测试签名 =========
      # 只在 workflow_dispatch 时执行。测试证书不作为正式发布证书，
      # 因此签名后的 EXE 放在独立 artifact 中，不覆盖 dist-electron，
      # 也不会进入本地 release.sh 的正式 Release 汇总。
      - name: Stage Windows EXEs for SignPath test
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $source = Join-Path $PWD "dist-electron"
          $target = Join-Path $PWD "signpath-input"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          $files = @(
            Get-ChildItem -Path $source -File -Filter "Nowen-Note-*-setup.exe"
            Get-ChildItem -Path $source -File -Filter "Nowen-Note-*-portable.exe"
          ) | Sort-Object FullName -Unique

          if ($files.Count -lt 2) {
            throw "SignPath test requires both setup.exe and portable.exe; found $($files.Count)."
          }

          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $target $file.Name) -Force
            Write-Host "Prepared unsigned artifact: $($file.Name)"
          }

      - name: Upload unsigned Windows EXEs for SignPath
        id: upload_signpath_test
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-signpath-input-${{ github.run_id }}
          path: signpath-input/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath test signing request
        id: signpath_test
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "3fd6029d-c909-43a1-8b30-4d2bcdde4c7a"
          project-slug: "nowen-note"
          signing-policy-slug: "test-signing"
          github-artifact-id: ${{ steps.upload_signpath_test.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signpath-signed

      - name: Verify SignPath test signatures
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $expected = @(Get-ChildItem -Path "signpath-input" -File -Filter "*.exe")
          $signed = @(Get-ChildItem -Path "signpath-signed" -Recurse -File -Filter "*.exe")
          $verifiedDir = Join-Path $PWD "signpath-verified"
          New-Item -ItemType Directory -Force -Path $verifiedDir | Out-Null

          if ($signed.Count -lt $expected.Count) {
            throw "SignPath returned fewer EXE files than submitted: expected $($expected.Count), got $($signed.Count)."
          }

          foreach ($inputFile in $expected) {
            $matches = @($signed | Where-Object { $_.Name -eq $inputFile.Name })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one signed result for $($inputFile.Name), got $($matches.Count)."
            }

            $result = $matches[0]
            $signature = Get-AuthenticodeSignature -LiteralPath $result.FullName
            if ($null -eq $signature.SignerCertificate -or $signature.Status.ToString() -eq "NotSigned") {
              throw "SignPath result is not Authenticode-signed: $($result.Name)"
            }

            $subject = $signature.SignerCertificate.Subject
            $thumbprint = $signature.SignerCertificate.Thumbprint
            Write-Host "Signed: $($result.Name) | status=$($signature.Status) | subject=$subject | thumbprint=$thumbprint"
            Copy-Item -LiteralPath $result.FullName -Destination (Join-Path $verifiedDir $result.Name) -Force
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## SignPath test-signing"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Windows setup/portable artifacts returned with Authenticode signer certificates."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Test certificates may not be trusted by Windows; production release will switch to release-signing after the OSS release certificate becomes valid."

      - name: Upload SignPath test signed Windows EXEs
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-signpath-test
          path: signpath-verified/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build Electron (macOS x64 / Intel)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_LINK == '' && 'false' || 'true' }}
          NOWEN_MAC_ARCH: x64
          TARGET_ARCH: x64
          npm_config_target_arch: x64
        run: |
          npm run rebuild:native -- --target-platform=darwin --target-arch=x64
          npx electron-builder --config electron/builder.config.js --mac --publish never
        shell: bash

      - name: Build Electron (macOS arm64 / Apple Silicon)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_LINK == '' && 'false' || 'true' }}
          NOWEN_MAC_ARCH: arm64
          TARGET_ARCH: arm64
          npm_config_target_arch: arm64
        run: |
          npm run rebuild:native -- --target-platform=darwin --target-arch=arm64
          npx electron-builder --config electron/builder.config.js --mac --publish never
        shell: bash

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --config electron/builder.config.js --linux --publish never
        shell: bash

      # ========= 上传构建产物作为 workflow artifact =========
      # 这里只保存 CI 构建结果，方便下载、比对和补包；不会写入 GitHub Release。
      # workflow_dispatch 的 SignPath 测试签名产物使用独立的 nowen-note-win-signpath-test，
      # 因此这里仍保存原始构建产物，不会误把测试证书包带入正式发布链路。
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-${{ matrix.name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: ignore
          retention-days: 14
