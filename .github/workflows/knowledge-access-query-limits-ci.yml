name: Knowledge Access Query Limits CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/routes/search.ts'
      - 'backend/src/middleware/knowledgeFilesCapabilityGuard.ts'
      - 'backend/src/services/knowledge*.ts'
      - 'backend/tests/knowledge-tree-query-limits.test.ts'
      - '.github/workflows/knowledge-access-query-limits-ci.yml'

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --silent
      - name: Query limit regression tests
        run: node --import tsx --test tests/knowledge-tree-query-limits.test.ts
      - name: Backend typecheck
        run: npm run build:tsc

  autofix:
    if: github.event.pull_request.number == 645
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply authorization fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr645-autofix.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          raw = source[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"
          exec(compile(script, 'pr645-autofix.py', 'exec'))
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent
      - name: Run authorization regressions
        working-directory: backend
        run: node --import tsx --test tests/knowledge-tree-query-limits.test.ts tests/knowledge-tree-restricted-access.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: Commit fixes
        shell: bash
        run: |
          cat > .github/workflows/knowledge-access-query-limits-ci.yml <<'EOF'
          name: Knowledge Access Query Limits CI

          on:
            pull_request:
              branches: [main]
              paths:
                - 'backend/src/routes/search.ts'
                - 'backend/src/middleware/knowledgeFilesCapabilityGuard.ts'
                - 'backend/src/services/knowledge*.ts'
                - 'backend/tests/knowledge-tree-query-limits.test.ts'
                - '.github/workflows/knowledge-access-query-limits-ci.yml'

          permissions:
            contents: read

          jobs:
            backend:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                    cache-dependency-path: backend/package-lock.json
                - run: npm ci --silent
                - name: Query limit regression tests
                  run: node --import tsx --test tests/knowledge-tree-query-limits.test.ts
                - name: Backend typecheck
                  run: npm run build:tsc
          EOF
          rm -f .github/workflows/pr645-autofix.yml
          rm -f .github/workflows/pr645-autofix-runner.yml
          rm -f .github/pr645-autofix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 完成团队空间权限链路收口"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
