name: Set offline sync default off

on:
  push:
    branches:
      - release/v1.4.10
    paths:
      - .github/workflows/set-offline-sync-default-off-v1410.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.10
          fetch-depth: 0
      - name: Apply default-off change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/offlineWorkspaceSync.ts')
          text = path.read_text()
          old = '    enabled: nativeRemote,\n'
          new = '    // 离线同步属于显式能力：所有平台首次使用默认关闭，仅在用户主动开启后运行。\n    enabled: false,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one default enabled assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/set-offline-sync-default-off-v1410.yml
          git config user.name 'Drug'
          git config user.email 'cropflre2333@gmail.com'
          git add frontend/src/lib/offlineWorkspaceSync.ts .github/workflows/set-offline-sync-default-off-v1410.yml
          git commit -m 'fix: disable offline sync by default'
          git pull --rebase origin release/v1.4.10
          git push origin HEAD:release/v1.4.10
