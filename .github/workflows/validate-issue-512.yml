name: Validate issue 512 tree creation

on:
  push:
    branches: [main]
    paths:
      - .github/issue-512-validation-trigger

permissions:
  contents: write

concurrency:
  group: validate-issue-512
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install backend dependencies
        id: backend_install
        continue-on-error: true
        run: npm ci --prefix backend > /tmp/backend-install.log 2>&1

      - name: Backend typecheck
        id: backend_typecheck
        if: steps.backend_install.outcome == 'success'
        continue-on-error: true
        run: npm --prefix backend run build:tsc > /tmp/backend-typecheck.log 2>&1

      - name: Root document regression
        id: backend_test
        if: steps.backend_install.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/knowledge-tree-root-documents.test.ts > /tmp/backend-test.log 2>&1

      - name: Install frontend dependencies
        id: frontend_install
        continue-on-error: true
        run: npm ci --prefix frontend > /tmp/frontend-install.log 2>&1

      - name: Frontend production build
        id: frontend_build
        if: steps.frontend_install.outcome == 'success'
        continue-on-error: true
        run: npm --prefix frontend run build > /tmp/frontend-build.log 2>&1

      - name: Publish validation result
        if: always()
        shell: bash
        env:
          BACKEND_INSTALL: ${{ steps.backend_install.outcome }}
          BACKEND_TYPECHECK: ${{ steps.backend_typecheck.outcome }}
          BACKEND_TEST: ${{ steps.backend_test.outcome }}
          FRONTEND_INSTALL: ${{ steps.frontend_install.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
        run: |
          {
            echo "# Issue 512 validation"
            echo
            echo "- backend install: ${BACKEND_INSTALL}"
            echo "- backend typecheck: ${BACKEND_TYPECHECK}"
            echo "- root document regression: ${BACKEND_TEST}"
            echo "- frontend install: ${FRONTEND_INSTALL}"
            echo "- frontend build: ${FRONTEND_BUILD}"
            for item in backend-install backend-typecheck backend-test frontend-install frontend-build; do
              file="/tmp/${item}.log"
              if [ -f "$file" ]; then
                echo
                echo "## ${item}"
                echo '```text'
                tail -n 80 "$file"
                echo '```'
              fi
            done
          } > .github/issue-512-validation-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/issue-512-validation-result.md
          git commit -m "ci(tree): record issue 512 validation result" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require successful validation
        if: always()
        env:
          BACKEND_INSTALL: ${{ steps.backend_install.outcome }}
          BACKEND_TYPECHECK: ${{ steps.backend_typecheck.outcome }}
          BACKEND_TEST: ${{ steps.backend_test.outcome }}
          FRONTEND_INSTALL: ${{ steps.frontend_install.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
        run: |
          test "$BACKEND_INSTALL" = success
          test "$BACKEND_TYPECHECK" = success
          test "$BACKEND_TEST" = success
          test "$FRONTEND_INSTALL" = success
          test "$FRONTEND_BUILD" = success
