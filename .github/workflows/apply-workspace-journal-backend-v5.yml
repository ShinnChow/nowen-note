name: Apply Workspace Journal Backend V5

on:
  push:
    branches:
      - feature/workspace-shared-journals-v5
    paths:
      - scripts/apply-workspace-journal-backend-v5.mjs
      - .github/workflows/apply-workspace-journal-backend-v5.yml
  pull_request:
    branches:
      - feature/journal-cleanup-natural-dates-v4

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-shared-journals-v5
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply deterministic backend integration
        run: node scripts/apply-workspace-journal-backend-v5.mjs
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent
      - name: Workspace journal service regression
        working-directory: backend
        run: npx tsx --test tests/workspace-journals.test.ts
      - name: Workspace journal route lifecycle
        working-directory: backend
        run: npx tsx --test tests/workspace-journal-routes.test.ts
      - name: Existing journal regressions
        working-directory: backend
        run: >-
          npx tsx --test
          tests/journal-archive-tree.test.ts
          tests/journal-archive-routes.test.ts
          tests/journal-archive-cleanup.test.ts
          tests/journal-archive-cleanup-routes.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: PostgreSQL schema contains workspace journal bindings
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS workspace_journals' backend/src/db/postgres/schema.base.sql
          grep -q 'PRIMARY KEY ("workspaceId", "journalDate")' backend/src/db/postgres/schema.base.sql
      - name: Commit integrated backend files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/db/migrations.ts backend/src/db/postgres/schema.base.sql backend/src/routes/journals.ts
          if git diff --cached --quiet; then
            echo "No backend integration changes to commit"
            exit 0
          fi
          git commit -m "feat(journals): expose workspace shared journal API"
          git push origin HEAD:feature/workspace-shared-journals-v5
