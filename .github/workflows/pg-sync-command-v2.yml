name: Guarded PostgreSQL main synchronization

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: guarded-pg-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.issue.number == 299 && github.event.issue.pull_request && github.event.comment.body == '/sync-main-into-pg-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge latest main and apply reconciled files
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main pg-sync-main-resolved-20260730
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git merge --no-ff --no-edit -X ours origin/main
          git checkout origin/pg-sync-main-resolved-20260730 -- \
            backend/build.bundle.mjs \
            backend/package.json \
            backend/src/index.hardened.ts \
            backend/src/routes/import-batches.ts \
            backend/src/routes/roundtrip-permissions.ts \
            backend/src/services/roundTripPermissionMapping.ts \
            frontend/src/main.tsx
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("backend/scripts/direct-db-access-deferred-exceptions.json")
          data = json.loads(path.read_text())
          files = data["files"]
          files["routes/backup-webdav.ts"] = {
            "owner": "#253",
            "reason": "Main added encrypted WebDAV backup configuration through the default SQLite backup runtime. PostgreSQL backup/restore and remote target persistence are explicitly owned by #253.",
            "counts": {"getDb-call": 1},
          }
          files["routes/knowledge-tree.ts"]["reason"] = "Main expanded unified-tree password, root-document and ownership operations. The route remains default-runtime-only until the complete #249 cross-driver knowledge-tree transaction boundary is migrated."
          files["routes/knowledge-tree.ts"]["counts"] = {
            "getDb-call": 2,
            "prepare-call": 12,
            "transaction-call": 2,
          }
          files["services/backup-webdav.ts"] = {
            "owner": "#253",
            "reason": "Encrypted WebDAV target persistence and backup upload orchestration belong to the PostgreSQL backup/restore redesign tracked by #253; PostgreSQL runtime-only does not mount this SQLite service.",
            "counts": {"getDb-call": 3},
          }
          files["services/knowledgeTreeRootDocuments.ts"] = {
            "owner": "#249",
            "reason": "Root-level document creation and hierarchy normalization span notes, notebooks and knowledge-tree nodes in one SQLite transaction and must migrate atomically with the #249 tree Repository boundary.",
            "counts": {"better-sqlite3": 1, "getDb-call": 3, "prepare-call": 13, "transaction-call": 3},
          }
          files["services/notebookOwnershipTransfer.ts"] = {
            "owner": "#249",
            "reason": "Notebook ownership transfer performs capability, membership, hierarchy and schema compatibility updates as one SQLite transaction. It requires a dedicated #249 cross-driver transaction implementation.",
            "counts": {"better-sqlite3": 1, "getDb-call": 1, "prepare-call": 18, "sqlite-master": 1, "transaction-call": 1},
          }
          files["services/nowenPackageExport.ts"]["reason"] = "Main added password-aware package export scope reads. Export consistency, protected-tree filtering and cross-driver streaming remain owned by the #251 migration tooling stage."
          files["services/nowenPackageExport.ts"]["counts"] = {"getDb-call": 3, "prepare-call": 7}
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n")
          PY
          rm -f .github/workflows/pg-sync-command-v2.yml
          git add -A
          git commit --amend --no-edit
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund || (sleep 5 && npm ci --no-audit --no-fund)
      - name: Backend TypeScript
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Direct DB audit
        working-directory: backend
        run: npm run audit:sqlite-boundaries
      - name: PostgreSQL schema parity
        working-directory: backend
        run: npm run audit:pg-schema-parity
      - name: PostgreSQL runtime tests
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/database-runtime.test.ts
          tests/repository-permissions-pg.test.ts
          tests/roundtrip-permission-mapping-pg.test.ts
          tests/note-core-runtime-pg.test.ts
          tests/note-core-runtime-formats-pg.test.ts
          tests/note-realtime-route-pg.test.ts
          tests/postgres-yjs-read-runtime-pg.test.ts
          tests/postgres-realtime-yjs-pg.test.ts
      - name: SQLite regression
        working-directory: backend
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ""
          TEST_PG_DATABASE_URL: ""
        run: npm run test:serial
      - name: Backend bundle
        working-directory: backend
        run: npm run build
      - name: Verify PostgreSQL resources
        working-directory: backend
        run: |
          test -f dist/postgres/schema.sql
          test -f dist/postgres/schema.base.sql
          test -f dist/postgres/migrations/0012_tag_scope_unique_names.sql
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund || (sleep 5 && npm ci --no-audit --no-fund)
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Push synchronized branch
        run: git push origin HEAD:pg-migration-unified
      - name: Publish success
        if: success()
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}"
          -X PATCH -f body="✅ PG sync passed and pushed. before=${{ steps.merge.outputs.before }} main=${{ steps.merge.outputs.main }} merge=${{ steps.merge.outputs.after }} run=${{ github.run_id }}"
      - name: Publish failure
        if: failure()
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}"
          -X PATCH -f body="❌ PG sync failed before push. run=${{ github.run_id }}"
