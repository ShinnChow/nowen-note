name: Notebook Permission Management CI

on:
  pull_request:
    paths:
      - "backend/src/runtime/notebook-permission-management.ts"
      - "backend/src/runtime/knowledge-tree-migration-bootstrap.ts"
      - "backend/src/services/notebookOwnershipTransfer.ts"
      - "backend/tests/notebook-owner-transfer.test.ts"
      - "frontend/src/components/NotebookShareDialog.tsx"
      - "frontend/src/components/__tests__/NotebookPermissionManagement.test.ts"
      - "frontend/src/components/__tests__/NotebookShareDialogClipboard.test.ts"
      - "frontend/src/lib/notebookPermissionManagementApi.ts"
      - ".github/workflows/notebook-permission-management-ci.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Ownership transfer regression
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/notebook-owner-transfer.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npx tsc --noEmit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Permission management regression
        working-directory: frontend
        run: npm run test:run -- src/components/__tests__/NotebookPermissionManagement.test.ts src/components/__tests__/NotebookShareDialogClipboard.test.ts
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
