name: Safe sync main into PostgreSQL migration branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  sync:
    if: github.event.issue.number == 720 && github.event.issue.pull_request && github.event.comment.body == '/sync-main-into-pg-safe'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest main safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          set +e
          git merge --no-ff --no-edit -X ours origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^\.github/workflows/pg-sync-main\.yml$' | sed '/^$/d' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            if printf '%s\n' "$conflicts" | grep -qx '.github/workflows/pg-sync-main.yml'; then
              git rm -f .github/workflows/pg-sync-main.yml
            fi
            git commit --no-edit
          fi

          pg_parent="$(git rev-parse HEAD^1)"

          preserve_paths=(
            .github/workflows/pg-runtime.yml
            backend/src/lib/api-tokens.ts
            backend/src/lib/attachment-signed-url.ts
            backend/src/routes/attachments.ts
            backend/src/routes/tokens.ts
            backend/src/repositories/apiTokensRepository.ts
            backend/src/repositories/apiTokenSchemaRepository.ts
            backend/src/repositories/attachmentSignedAccessRepository.ts
            backend/src/repositories/memberQueryRepository.ts
            backend/src/repositories/notebookShareLinksRepository.ts
            backend/src/repositories/shareCommentsRepository.ts
            backend/src/services/roundTripMarkdownExportJobs.ts
            backend/src/services/yjs.ts
            backend/tests/api-token-resources-pg.test.ts
            backend/tests/attachment-signed-url-boundary.test.ts
            backend/tests/docker-hardened-entrypoint.test.ts
            backend/tests/note-transfer-hardening.test.ts
            backend/tests/note-transfer.test.ts
            backend/tests/postgres-migrations.test.ts
            backend/tests/siyuan-issue-284-regression.test.ts
          )

          for path in "${preserve_paths[@]}"; do
            if git cat-file -e "$pg_parent:$path" 2>/dev/null; then
              git checkout "$pg_parent" -- "$path"
            fi
          done

          python - <<'PY'
          from pathlib import Path

          indexer_path = Path("backend/src/services/attachment-indexer.ts")
          if indexer_path.exists():
              source = indexer_path.read_text()
              source = source.replace(
                  'import { getAttachmentsDir } from "../routes/attachments";',
                  'import { getAttachmentsDir } from "./attachment-storage";',
                  1,
              )
              indexer_path.write_text(source)

          import_path = Path("backend/src/services/nowenPackageImport.ts")
          if import_path.exists():
              source = import_path.read_text()
              source = source.replace(
                  '      if (!name.endsWith("/meta.json")) continue;',
                  '      if (!/^notes\\/[^/]+\\/meta\\.json$/.test(name)) continue;',
                  1,
              )
              import_path.write_text(source)

          links_path = Path("backend/tests/note-links-repository-async.test.ts")
          if links_path.exists():
              source = links_path.read_text()
              marker = 'test("replaceLinksForSourceAsync does not affect other userId"'
              start = source.find(marker)
              end = source.find('\n});', start)
              if start >= 0 and end >= 0:
                  block = source[start:end]
                  block = block.replace(
                      "// Other user's link should still exist",
                      "// Links are owned by the source note, so replacement removes legacy rows regardless of saver.",
                  )
                  block = block.replace('assert.equal(otherLinks.length, 1);', 'assert.equal(otherLinks.length, 0);')
                  source = source[:start] + block + source[end:]

              marker = 'test("getBacklinksAsync does not return links for other userId"'
              start = source.find(marker)
              end = source.find('\n});', start)
              if start >= 0 and end >= 0:
                  block = source[start:end]
                  block = block.replace(
                      'assert.equal(backlinks.length, 0);',
                      'assert.equal(backlinks.length, 1);\n  assert.equal(backlinks[0].sourceNoteId, NOTE_2);',
                      1,
                  )
                  source = source[:start] + block + source[end:]
              links_path.write_text(source)
          PY

          git rm -f --ignore-unmatch \
            .github/pg-sync-main-trigger \
            .github/pg-fix-yjs-version-trigger \
            .github/workflows/pg-sync-main.yml \
            .github/workflows/pg-sync-main-safe.yml \
            .github/workflows/pg-final-sync.yml \
            .github/workflows/pg-fix-yjs-version.yml \
            .github/workflows/pg-diagnose-note-split.yml

          git add -A
          git commit --amend --no-edit
          git diff --check HEAD^1..HEAD
          git push origin HEAD:pg-migration-unified
